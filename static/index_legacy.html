var st=document.createElement('style'); st.textContent=css; document.head.appendChild(st);

function prox(u){ if(!u) return ''; if(u.charAt(0)==='/') return u; try{ return '/proxy?u='+encodeURIComponent(u)+'&ref='+encodeURIComponent((new URL(u)).origin+'/'); }catch(e){ return u; } }
window.kjProx = prox;

function lineEls(){ return document.querySelectorAll('#lines .ln'); }
function setStatus(i,txt){ var els=lineEls(); if(els[i]){ var s=els[i].querySelector('.lst'); if(s) s.textContent=txt; } }
function markCurrent(i){
  var els=lineEls();
  els.forEach(function(n,j){ n.classList.toggle('on', i===j); var s=n.querySelector('.lst'); if(s) s.textContent = (i===j)?'当前':'待确认'; });
  var lines=window.__kjPlayLines||[]; var x=lines[i];
  var nm=$('pldCurName'); if(nm&&x) nm.textContent=x.label||('线路'+(i+1));
  var ln=$('plLineName'); if(ln&&x) ln.textContent=x.label||'';
  var rs=$('pldCurRes'); if(rs) rs.textContent='';
}
var smart={idx:-1,mode:'direct'};
function playSmart(i){
  var x=(window.__kjPlayLines||[])[i]; if(!x) return;
  smart.idx=i; smart.mode='direct';
  enterTakeover();
  play(x.url, x.label);
}
var tried={};
window.__kjFatalHook=function(data){
  var lines=window.__kjPlayLines||[]; var x=lines[smart.idx];
  if(!x) return;
  var code=(data&&data.response&&data.response.code)||(data&&data.details)||(data&&data.type)||'';
  if(smart.mode==='direct'){ smart.mode='proxy'; toast('直连失败，切换中转…'); play(prox(x.url), x.label); return; }
  tried[smart.idx]=code||true;
  setStatus(smart.idx,'失败'+(code?'('+code+')':''));
  var nxt=-1;
  for(var k=1;k<=lines.length;k++){
    var j=(smart.idx+k)%lines.length;
    if(tried[j]) continue;
    if(lines[j].kind==='hls'||lines[j].kind==='mp4'||lines[j].kind==='resolve'){ nxt=j; break; }
  }
  if(nxt>=0){ toast('该线路播放失败，自动切换下一条'); window.__kjChainNext=true; var els=lineEls(); if(els[nxt]) els[nxt].click(); }
  else { toast('全部线路播放失败，最后错误：'+code); var ln=$('plLineName'); if(ln) ln.textContent='播放失败：'+code; }
};
function enterTakeover(){
  var sg=$('plStage'); if(sg) sg.classList.add('takeover');
  document.body.classList.add('plLock');
}
function exitTakeover(){
  var sg=$('plStage'); if(sg) sg.classList.remove('takeover');
  document.body.classList.remove('plLock');
  var v=$('v'); if(v) v.pause();
}
function fallbackPlayable(){
  var lines=window.__kjPlayLines||[];
  for(var i=0;i<lines.length;i++){
    if(lines[i].kind==='hls'||lines[i].kind==='mp4'){ var els=lineEls(); if(els[i]) els[i].click(); return; }
  }
}
window.kjPlayLine=function(i){
  var lines=window.__kjPlayLines||[]; var x=lines[i]; if(!x) return;
  if(!window.__kjChainNext) tried={};
  window.__kjChainNext=false;
  var autoFB=window.__kjAutoFB; window.__kjAutoFB=false;
  if(x.kind==='hls'||x.kind==='mp4'){
    markCurrent(i);
    playSmart(i);
    var dr=$('plDrawer'); if(dr) dr.classList.remove('open');
    return;
  }
  if(x.kind==='resolve'){
    setStatus(i,'4K线路秒级解析中…');
    fetch('/api/resolve_line?wait=20&token='+encodeURIComponent(window.__kjPlayToken||'')+'&sid='+encodeURIComponent(x.sid||'')+'&ticket='+encodeURIComponent(x.ticket||''))
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(d.ok&&d.url){
          x.kind=d.kind||'hls'; x.url=d.url;
          markCurrent(i);
          playSmart(i);
          var dr=$('plDrawer'); if(dr) dr.classList.remove('open');
        } else {
          setStatus(i,'待确认');
          toast('该线路解析失败：'+(d.error||'上游未返回直链'));
          if(autoFB) fallbackPlayable();
        }
      })
      .catch(function(){ setStatus(i,'待确认'); if(autoFB) fallbackPlayable(); });
    return;
  }
  toast('该线路不可直接播放');
};

function buildEps(){
  var box=$('plEps'); if(!box) return;
  box.innerHTML='';
  var eps=window.__kjEps||[];
  var chips=document.querySelectorAll('#detail .eps .ep');
  eps.forEach(function(e,i){
    var b=document.createElement('button');
    b.textContent=e.title||('第'+(i+1)+'集');
    if(chips[i]&&chips[i].classList.contains('on')) b.className='on';
    b.onclick=function(){ if(chips[i]) chips[i].click(); var d=$('plEpDrawer'); if(d) d.classList.remove('open'); var s=$('plStage'); if(s) s.scrollIntoView({behavior:'smooth',block:'center'}); };
    box.appendChild(b);
  });
  if(!eps.length) box.innerHTML='<div style="color:#9aa0ad;font-size:13px">单集内容，无选集</div>';
}
function nextLine(){
  var lines=window.__kjPlayLines||[]; if(!lines.length) return;
  var els=lineEls(); var cur=-1;
  els.forEach(function(n,j){ if(n.classList.contains('on')) cur=j; });
  for(var k=1;k<=lines.length;k++){
    var i=(cur+k)%lines.length;
    if(lines[i].kind==='hls'||lines[i].kind==='mp4'||lines[i].kind==='resolve'){ if(els[i]) els[i].click(); return; }
  }
}
function togglePlay(){ var v=$('v'); if(!v) return; if(v.paused) v.play().catch(function(){}); else v.pause(); }

document.addEventListener('click',function(e){
  var t=e.target; if(!t||!t.id) return;
  if(t.id==='plBtnLines'){ var d=$('plDrawer'); if(d) d.classList.add('open'); }
  else if(t.id==='pldClose'){ var d2=$('plDrawer'); if(d2) d2.classList.remove('open'); }
  else if(t.id==='plBtnEps'||t.id==='plEpChip'){ buildEps(); var d3=$('plEpDrawer'); if(d3) d3.classList.add('open'); }
  else if(t.id==='plEpClose'){ var d4=$('plEpDrawer'); if(d4) d4.classList.remove('open'); }
  else if(t.id==='pldNext'){ nextLine(); }
  else if(t.id==='plPlay'){ togglePlay(); }
  else if(t.id==='plBack'){ exitTakeover(); }
  else if(t.id==='plFs'){ var sg=$('plStage'); if(sg&&sg.requestFullscreen) sg.requestFullscreen().catch(function(){}); }
  else if(t.id==='v'){ togglePlay(); }
  else if(t.id==='plProg'||t.id==='plProgFill'||t.id==='plProgBuf'){
    var v=$('v'); var bar=$('plProg'); if(!v||!bar||!v.duration) return;
    var r=bar.getBoundingClientRect(); var ratio=(e.clientX-r.left)/r.width;
    v.currentTime=Math.max(0,Math.min(v.duration, ratio*v.duration));
  }
});

document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){ var sg=$('plStage'); if(sg&&sg.classList.contains('takeover')) exitTakeover(); }
});
function bindV(v){
  if(v.__kj7b) return; v.__kj7b=true;
  function updRes(){ var r=$('pldCurRes'); if(r&&v.videoWidth) r.textContent=v.videoWidth+' × '+v.videoHeight; }
  v.addEventListener('loadedmetadata',updRes);
  v.addEventListener('playing',updRes);
}
setInterval(function(){
  var v=$('v'); if(!v) return;
  bindV(v);
  var t=$('plTime'); if(t) t.textContent=fmt(v.currentTime)+' / '+fmt(v.duration||0);
  var f=$('plProgFill'); if(f) f.style.width=(v.duration?(v.currentTime/v.duration*100):0)+'%';
  var b=$('plProgBuf'); if(b&&v.duration&&v.buffered&&v.buffered.length){ try{ b.style.width=(v.buffered.end(v.buffered.length-1)/v.duration*100)+'%'; }catch(_){ } }
  var pb=$('plPlay'); if(pb) pb.textContent=v.paused?'▶':'⏸';
},400);
})();
</script>
