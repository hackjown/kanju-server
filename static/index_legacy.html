<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>看剧AI - KANJU.AI</title>
<style>
:root{--bg:#0d0f14;--card:#171a21;--line:#252a34;--fg:#e9e6df;--dim:#8b8579;--acc:#e8b44a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 system-ui,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}
header{position:sticky;top:0;z-index:9;background:rgba(13,15,20,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:1400px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:18px}
.logo{font-size:20px;font-weight:800;letter-spacing:1px}
.logo b{color:var(--acc)}
.search{flex:1;max-width:460px;display:flex;gap:8px}
.search input{flex:1;background:#1b1f27;border:1px solid var(--line);color:var(--fg);padding:8px 12px;border-radius:8px;outline:none}
.search input:focus{border-color:var(--acc)}
.search button{background:var(--acc);color:#1a1200;border:0;padding:8px 16px;border-radius:8px;font-weight:700;cursor:pointer}
#stat{font-size:12px;color:var(--dim)}
main{max-width:1400px;margin:0 auto;padding:20px}
.sec{margin-bottom:34px}
.sec h2{font-size:17px;margin:0 0 12px;display:flex;align-items:baseline;gap:10px}
.sec h2 span{font-size:12px;color:var(--dim);font-weight:400}
.row{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.card{background:var(--card);border-radius:10px;overflow:hidden;cursor:pointer;transition:.18s;border:1px solid transparent}
.card:hover{transform:translateY(-3px);border-color:var(--acc)}
.card img{width:100%;aspect-ratio:2/3;object-fit:cover;background:#11141a;display:block}
.card .t{padding:8px 9px 4px;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .s{padding:0 9px 9px;font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{background:#1b1f27;border:1px solid var(--line);color:var(--fg);padding:7px 14px;border-radius:8px;cursor:pointer;margin-bottom:16px}
.back:hover{border-color:var(--acc)}
.hd{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:18px}
.hd img{width:200px;aspect-ratio:2/3;object-fit:cover;border-radius:10px;background:#11141a}
.hd .info{flex:1;min-width:280px}
.hd h1{margin:0 0 8px;font-size:24px}
.sub{color:var(--dim);font-size:13px;margin-bottom:5px}
.desc{color:#b9b3a7;font-size:13px;margin-top:10px;max-width:820px}
h3.tit{font-size:15px;margin:22px 0 10px}
.eps{display:flex;flex-wrap:wrap;gap:8px;max-height:190px;overflow:auto;padding-right:6px}
.ep{background:#1b1f27;border:1px solid var(--line);padding:6px 12px;border-radius:7px;cursor:pointer;font-size:12.5px}
.ep:hover{border-color:var(--acc)}
.ep.on{background:var(--acc);color:#1a1200;border-color:var(--acc);font-weight:700}
.lines{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px;max-height:200px;overflow:auto}
.ln{display:flex;align-items:center;gap:8px;background:#1b1f27;border:1px solid var(--line);padding:6px 12px;border-radius:7px;cursor:pointer;font-size:12.5px;min-width:190px}
.ln:hover{border-color:var(--acc)}
.ln.on{background:var(--acc);color:#1a1200;border-color:var(--acc);font-weight:700}
.ln .prov{font-size:11px;opacity:.65}
.ln .st{margin-left:auto;font-size:11px;opacity:.8}
#v{width:100%;max-height:72vh;background:#000;border-radius:10px;display:block}
#msg2{color:var(--dim);font-size:12px;margin-top:8px}
#msg{color:var(--dim);padding:30px 0}
#detail{display:none}
footer{max-width:1400px;margin:0 auto;padding:22px 20px 40px;color:#5d5a52;font-size:12px;border-top:1px solid var(--line)}
#kjDomainBar{background:linear-gradient(90deg,#2a1f05,#3a2a07);color:#f3d489;font-size:12.5px;padding:7px 16px;display:flex;gap:10px;align-items:center;justify-content:center}
#kjDomainBar b{color:#ffd968}
#kjDomainBar .x{margin-left:8px;cursor:pointer;opacity:.75;border:1px solid #6b5518;background:transparent;color:#f3d489;border-radius:6px;padding:1px 8px}
#kj5nav{max-width:1400px;margin:0 auto;padding:10px 20px 0;display:flex;gap:8px;flex-wrap:wrap}
.kj5nb{background:#1b1f27;border:1px solid var(--line);color:var(--fg);padding:6px 14px;border-radius:999px;cursor:pointer;font-size:13px}
.kj5nb:hover{border-color:var(--acc);color:var(--acc)}
.kj5tabs{display:flex;gap:8px;margin:0 0 12px;flex-wrap:wrap}
.kj5tab{background:#1b1f27;border:1px solid var(--line);color:var(--fg);padding:5px 13px;border-radius:999px;cursor:pointer;font-size:12.5px}
.kj5tab.on{background:var(--acc);color:#1a1200;border-color:var(--acc);font-weight:700}
.card .heat{color:#e8b44a;font-size:11px;padding:0 9px 2px}
.card .rk{position:absolute;top:0;left:0;background:var(--acc);color:#1a1200;font-weight:800;font-size:12px;padding:2px 8px;border-radius:0 0 8px 0}
.card{position:relative}
.kj5modal{position:fixed;inset:0;background:rgba(0,0,0,.66);display:none;align-items:center;justify-content:center;z-index:60}
.kj5box{background:#171a21;border:1px solid var(--line);border-radius:14px;max-width:520px;width:92%;max-height:84vh;overflow:auto;padding:22px}
.kj5box h3{margin:0 0 12px;font-size:16px}
.kj5box input,.kj5box textarea,.kj5box select{width:100%;background:#1b1f27;border:1px solid var(--line);color:var(--fg);padding:9px 12px;border-radius:8px;margin-bottom:10px;outline:none}
.kj5box .rowb{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
.kj5btn{background:var(--acc);color:#1a1200;border:0;padding:8px 16px;border-radius:8px;font-weight:700;cursor:pointer}
.kj5btn.ghost{background:#1b1f27;color:var(--fg);border:1px solid var(--line)}
.kj5act{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.kj5ab{background:#1b1f27;border:1px solid var(--line);color:var(--fg);padding:7px 14px;border-radius:999px;cursor:pointer;font-size:13px}
.kj5ab:hover{border-color:var(--acc);color:var(--acc)}
.kj5cmt{border-top:1px solid var(--line);padding:10px 0}
.kj5cmt .n{color:var(--acc);font-size:12.5px;font-weight:700}
.kj5cmt .b{margin-top:2px}
.kj5cmt .t{color:var(--dim);font-size:11px}
.kj5prog{height:8px;background:#1b1f27;border-radius:99px;overflow:hidden;margin:6px 0 12px}
.kj5prog i{display:block;height:100%;background:var(--acc)}
.kj5kv{display:flex;gap:22px;flex-wrap:wrap;margin:10px 0}
.kj5kv div b{font-size:19px;color:var(--acc);display:block}
.kj5kv div span{color:var(--dim);font-size:12px}
.kj5plcard .lock{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.6);border-radius:6px;padding:1px 7px;font-size:11px;color:#ffd968}
.kj5grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.kj5cover{width:100%;aspect-ratio:2/3;object-fit:cover;background:#11141a;display:block}
.kj5ph{width:100%;aspect-ratio:2/3;background:linear-gradient(140deg,#232733,#14161c);display:flex;align-items:center;justify-content:center;color:#5d5a52;font-size:12px}
.kj5sentinel{height:10px}
.kj5eprange{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.kj5eprange button{background:#1b1f27;border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:3px 10px;cursor:pointer;font-size:12px}
.kj5eprange button.on{background:var(--acc);color:#1a1200;font-weight:700}

</style>
</head>
<body>
<header><div class="bar">
  <div class="logo">看剧<b>AI</b> <span style="font-size:11px;color:#5d5a52;font-weight:400">复刻站</span></div>
  <div class="search"><input id="q" placeholder="搜索影片 / 剧名…"/><button id="btnq">搜索</button></div>
  <div id="stat">正在连接上游…</div>
</div></header>

<main>
  <div id="home"></div>
  <div id="detail"></div>
</main>
<footer>本站为技术复刻演示：后端复现前端硬编码 HMAC 签名，实时代理上游 /v1/feed/home、/v1/catalog、/v1/playback/episodes 接口与 m3u8 片源。<span id="ft"></span></footer>

<script src="/static/hls.min.js">/* KANJU_4K_UI */
</script>
<script src="/static/p2p-hlsjs.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const el = (t, c, h) => { const e = document.createElement(t); if(c) e.className = c; if(h!=null) e.innerHTML = h; return e; };
const esc = s => String(s==null?'':s).replace(/[<>&"]/g, c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));

function fmtCard(c){
  const d = el('div','card');
  d.innerHTML = `<img loading="lazy" src="${esc(c.poster)}" onerror="this.style.opacity=.15"/>
    <div class="t">${esc(c.title)}</div>
    <div class="s">${esc(c.year||'')} ${esc(c.remarks||(c.kind==='series'?'剧集':'影片'))}</div>`;
  d.onclick = () => openDetail(c.id);
  return d;
}

async function loadHome(){
  $('#stat').textContent = '拉取首页…';
  const r = await fetch('/api/home');
  const d = await r.json();
  if(!d.ok){ $('#stat').textContent = '接口失败: '+(d.error||''); return; }
  const secs = d.sections || [];
  let n = 0; $('#home').innerHTML = '';
  for(const s of secs){
    if(!s.cards || !s.cards.length) continue;
    const box = el('div','sec');
    box.appendChild(el('h2',null,`${esc(s.title)} <span>${s.cards.length} 部</span>`));
    const row = el('div','row');
    s.cards.forEach(c=>{ row.appendChild(fmtCard(c)); n++; });
    box.appendChild(row); $('#home').appendChild(box);
  }
  $('#stat').textContent = `实时数据 · ${secs.length} 个栏目 / ${n} 部影片`;
}

let curEp = null, curTitle = '', HLS = null;

async function openDetail(id){
  $('#home').style.display = 'none';
  const dv = $('#detail'); dv.style.display = 'block';
  dv.innerHTML = '<div id="msg">拉取详情（HMAC 签名）…</div>';
  const r = await fetch('/api/detail/' + encodeURIComponent(id));
  const d = await r.json();
  const m = d;
  if(!m.ok){ dv.innerHTML = '<button class="back" onclick="goHome()">← 返回</button><div id="msg">详情失败: '+esc(m.error)+'</div>'; return; }
  dv.innerHTML = '';
  const bk = el('button','back','← 返回'); bk.onclick = goHome; dv.appendChild(bk);
  const hd = el('div','hd');
  hd.innerHTML = `<img src="${esc(m.poster)}" onerror="this.style.opacity=.15"/>
    <div class="info">
      <h1>${esc(m.title)} <span style="font-size:14px;color:var(--dim)">${esc(m.year||'')}</span></h1>
      <div class="sub">${m.episode_count>1?'剧集':'影片'} · ${esc(m.area||'')} · ${esc(m.remarks||'')}</div>
      <div class="sub">主演：${esc((m.actors||[]).join(' / '))}</div>
      <div class="sub">导演：${esc((m.directors||[]).join(' / '))}</div>
      <div class="sub">类型：${esc((m.genres||[]).join(' / '))}</div>
      <div class="desc">${esc((m.description||'').slice(0,500))}</div>
    </div>`;
  dv.appendChild(hd);

  const eps = (m.episodes||[]);
  window.__kjEps = eps; window.__kjMeta = {title:m.title||'', year:m.year||'', area:m.area||'', remarks:m.remarks||''};
  if(eps.length){
    dv.appendChild(el('h3','tit',`选集（共 ${eps.length} 集${m.progress?' · '+esc(m.progress):''}）`));
    const box = el('div','eps');
    eps.forEach((e,i)=>{
      const b = el('div','ep'+(i===0?' on':''), esc(e.title||('第'+(i+1)+'集')));
      b.onclick = () => { box.querySelectorAll('.ep').forEach(x=>x.classList.remove('on')); b.classList.add('on'); loadPlay(e.token, m.title); };
      box.appendChild(b);
    });
    dv.appendChild(box);
  }
  const stage = el('div'); stage.id = 'plStage';
  stage.innerHTML =
    '<div id="plTop"><button id="plBack" class="plbtn">\u2190</button><div class="pltt"><div id="plTitle"></div><div id="plSub"></div></div>' +
    '<div class="pltb"><button id="plBtnEps" class="plbtn">选集</button><button id="plBtnLines" class="plbtn gold">换源</button></div></div>' +
    '<video id="v" playsinline></video>' +
    '<button id="plEpChip">\u2263 正片 \u203a</button>' +
    '<div id="plCtl"><button id="plPlay">\u25b6</button><div id="plProg"><div id="plProgBuf"></div><div id="plProgFill"></div></div><span id="plTime">00:00 / 00:00</span><span id="plLineName"></span><button id="plFs">\u26f6 全屏</button></div>';
  dv.appendChild(stage);
  stage.querySelector('#plTitle').textContent = m.title || '';
  stage.querySelector('#plSub').textContent = ((m.year||'') + (m.area ? ' · ' + m.area : '') + (m.remarks ? ' · ' + m.remarks : '')).replace(/^ · /, '');
  const drawer = el('div'); drawer.id = 'plDrawer';
  drawer.innerHTML =
    '<div class="pld-head"><div><div class="pld-t">换源</div><div class="pld-s">选择其他线路，继续观看</div></div><button id="pldClose">\u2715</button></div>' +
    '<div class="pld-cur"><button id="pldNext">\u27f3 卡顿？换一条</button><div class="pld-curlab">\u2713 当前线路</div><div id="pldCurName">—</div><div id="pldCurRes"></div></div>' +
    '<div class="pld-gridwrap"></div>';
  const lines = el('div','lines'); lines.id = 'lines';
  drawer.querySelector('.pld-gridwrap').appendChild(lines);
  dv.appendChild(drawer);
  const epd = el('div'); epd.id = 'plEpDrawer';
  epd.innerHTML =
    '<div class="pld-head"><div><div class="pld-t">正片</div><div class="pld-s">选择集数</div></div><button id="plEpClose">\u2715</button></div><div id="plEps"></div>';
  dv.appendChild(epd);
  dv.appendChild(el('div',null,'')).id='msg2';
  if(eps.length) loadPlay(eps[0].token, m.title);
}

function goHome(){
  $('#detail').style.display='none'; $('#detail').innerHTML='';
  $('#home').style.display='block';
  if(HLS){ HLS.destroy(); HLS=null; }
}

async function loadPlay(token, title){
  curEp = token; curTitle = title || '';
  const lines = $('#lines'); if(!lines) return;
  lines.innerHTML = '<div class="ln">解析线路中…</div>';
  const m2 = $('#msg2'); if(m2) m2.textContent = '';
  const r = await fetch('/api/play/' + encodeURIComponent(token));
  const d = await r.json();
  if(!d.ok){ lines.innerHTML = '<div class="ln">播放接口失败: '+esc(d.error)+'</div>'; return; }
  const ls = d.lines || [];
  lines.innerHTML = '';
  const prox = u => { if(!u) return ''; if(u.charAt(0)==='/') return u; /* 本地 HLS 直连，不套 proxy */
    try { return '/proxy?u=' + encodeURIComponent(u) + '&ref=' + encodeURIComponent((new URL(u)).origin + '/'); }
    catch(e) { return u; } };
  window.__kjPlayLines = ls; window.__kjPlayToken = token;
  ls.forEach((x,i)=>{
    const n = el('div','ln');
    n.innerHTML = '<div class="lnn">' + (x.is4k?'<b class="b4k">4K</b>':'') + esc(x.label||('线路'+(i+1))) + '</div><div class="lst">待确认</div>';
    n.onclick = ()=>{ if(window.kjPlayLine) kjPlayLine(i); };
    lines.appendChild(n);
  });
  const hls = ls.filter(x=>x.kind==='hls');
  const n4 = ls.filter(x=>x.is4k).length;
  if(m2) m2.textContent = `当前：${esc(d.current&&d.current.title||'')} · 共 ${ls.length} 路，HLS ${hls.length} 路，4K ${n4} 路`;
  var firstIdx = ls.findIndex(x=>x.is4k);
  if(firstIdx<0) firstIdx = ls.findIndex(x=>x.kind==='hls'||x.kind==='mp4');
  if(firstIdx>=0 && lines.children[firstIdx]){ window.__kjAutoFB = true; lines.children[firstIdx].click(); }
}

function kjP2PShow(){
  var s = window.__kjP2PStats; var bar = document.getElementById('kjP2PBar'); if(!bar || !s) return;
  var mb = function(n){ return (n/1048576).toFixed(2) + ' MB'; };
  var tot = s.p2pBytes + s.httpBytes;
  var ratio = tot ? Math.round(s.p2pBytes / tot * 100) : 0;
  bar.textContent = s.on
    ? ('P2P 加速：已连接 ' + s.peers + ' 个节点 · P2P 下载 ' + mb(s.p2pBytes) + ' · 直连 ' + mb(s.httpBytes) + ' · P2P 占比 ' + ratio + '%')
    : 'P2P 加速：未启用（直连播放）';
}
window.kjP2PShow = kjP2PShow;

function play(url, label){
  const v = $('#v'); if(!v) return;
  if(HLS){ HLS.destroy(); HLS=null; }
  const m2 = $('#msg2');
  if(url.indexOf('.mp4')>-1 || url.indexOf('mp4')>-1 && !/\.m3u8/.test(decodeURIComponent(url))){
    v.src = url; v.play().catch(()=>{}); return;
  }
  if(window.Hls && Hls.isSupported()){
    var cfg = {maxBufferLength:30, maxMaxBufferLength:60};
    window.__kjP2PStats = {peers:0, p2pBytes:0, httpBytes:0, on:false};
    if(window.__kjP2PEngine){ try{ window.__kjP2PEngine.destroy(); }catch(_){} window.__kjP2PEngine = null; }
    var useP2P = false;
    try{ useP2P = localStorage.getItem('kjP2P') !== 'off'; }catch(_){}
    if(useP2P && window.p2pml && p2pml.hlsjs && p2pml.hlsjs.HlsJsP2PEngine){
      try{
        var trackers = window.__kjP2PTrackers || ["wss://tracker.novage.com.ua","wss://tracker.openwebtorrent.com","wss://tracker.webtorrent.dev","wss://tracker.btorrent.xyz"];
        var eng = new p2pml.hlsjs.HlsJsP2PEngine({core:{announceTrackers: trackers, swarmId: url}});
        var pcfg = eng.getConfigForHlsJs();
        for(var k in pcfg) cfg[k] = pcfg[k];
        window.__kjP2PEngine = eng;
        window.__kjP2PStats.on = true;
        eng.addEventListener("onPeerConnect", function(){ window.__kjP2PStats.peers++; kjP2PShow(); });
        eng.addEventListener("onPeerClose", function(){ if(window.__kjP2PStats.peers>0) window.__kjP2PStats.peers--; kjP2PShow(); });
        eng.addEventListener("onSegmentLoaded", function(d){
          if(!d) return;
          if(d.downloadSource === "p2p") window.__kjP2PStats.p2pBytes += (d.bytesLength||0);
          else window.__kjP2PStats.httpBytes += (d.bytesLength||0);
          kjP2PShow();
        });
      }catch(e){ window.__kjP2PEngine = null; window.__kjP2PStats.on = false; }
    }
    HLS = new Hls(cfg);
    if(window.__kjP2PEngine){ try{ window.__kjP2PEngine.bindHls(HLS); }catch(_){} }
    kjP2PShow();
    HLS.loadSource(url); HLS.attachMedia(v);
    HLS.on(Hls.Events.MANIFEST_PARSED, ()=> v.play().catch(()=>{}));
    HLS.on(Hls.Events.ERROR, (e,data)=>{
      if(data && data.fatal && window.__kjFatalHook){ try{ window.__kjFatalHook(data); return; }catch(_){ } }
      if(data && data.fatal){
        if(m2) m2.textContent = '该线路播放失败：' + data.type + ' / ' + data.details + ' —— 请换一条线路';
        try{ HLS.destroy(); }catch(_){}
        HLS = null;
      }
    });
  } else if(v.canPlayType('application/vnd.apple.mpegurl')){
    v.src = url; v.play().catch(()=>{});
  } else {
    if(m2) m2.textContent = '浏览器不支持 HLS 播放';
  }
}

async function doSearch(){
  const q = $('#q').value.trim(); if(!q) return;
  $('#stat').textContent = '搜索中…';
  const r = await fetch('/api/search?q=' + encodeURIComponent(q));
  const d = await r.json();
  $('#detail').style.display='none';
  const box = $('#home'); box.style.display='block'; box.innerHTML='';
  const sec = el('div','sec'); sec.appendChild(el('h2',null,`搜索「${esc(q)}」`));
  const row = el('div','row');
  const list = (d.ok && d.items) ? d.items : [];
  if(!list.length) sec.appendChild(el('div',null,'<span style="color:var(--dim);font-size:13px">没有找到结果</span>'));
  list.forEach(c=>row.appendChild(fmtCard({id:c.id,title:c.title,poster:c.poster,year:c.year,remarks:c.remarks,kind:c.kind})));
  sec.appendChild(row); box.appendChild(sec);
  $('#stat').textContent = `搜索「${q}」· ${list.length} 条`;
}
$('#btnq').onclick = doSearch;
$('#q').addEventListener('keydown', e=>{ if(e.key==='Enter') doSearch(); });

$('#ft').textContent = ' 构建时间 ' + new Date().toLocaleString('zh-CN');
loadHome();

/* ===== KANJU_UI_PATCH v1 ===== */
const KJ = { rate: 1, histKey: 'kanju_hist' };
function kjEl(t, c, x){ var e=document.createElement(t); if(c)e.className=c; if(x!==undefined)e.textContent=x; return e; }
function kjToast(msg){ var d=kjEl('div','',msg); d.style.cssText='position:fixed;left:50%;top:20px;transform:translateX(-50%);background:#e8b44a;color:#1a1200;padding:8px 16px;border-radius:8px;font-weight:700;z-index:99'; document.body.appendChild(d); setTimeout(function(){d.remove();},2200); }

/* ---- 榜单面板 ---- */
function openRank(){
  var old=document.getElementById('kjRank'); if(old){ old.remove(); return; }
  var p=kjEl('div'); p.id='kjRank';
  p.style.cssText='position:fixed;right:18px;top:64px;width:340px;max-height:70vh;overflow:auto;background:#171a21;border:1px solid #252a34;border-radius:10px;padding:14px;z-index:80;box-shadow:0 8px 30px rgba(0,0,0,.5)';
  p.appendChild(kjEl('div','','热播榜 · 加载中…')).style.cssText='font-weight:700;margin-bottom:10px;color:#e8b44a';
  document.body.appendChild(p);
  fetch('/api/rank').then(function(r){return r.json();}).then(function(d){
    var box=p.firstChild; box.textContent='热播榜';
    var items=(d&&d.items)||[];
    if(!items.length){ p.appendChild(kjEl('div','','榜单为空')); return; }
    items.slice(0,20).forEach(function(it,i){
      var row=kjEl('div'); row.style.cssText='display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid #252a34;cursor:pointer';
      var n=kjEl('div','',String(i+1)); n.style.cssText='width:22px;color:'+(i<3?'#e8b44a':'#8b8579')+';font-weight:700';
      var t=kjEl('div','',(it.title||it.name||'?')+(it.year?' ('+it.year+')':'')); t.style.cssText='flex:1;font-size:13px';
      row.appendChild(n); row.appendChild(t);
      row.onclick=function(){ p.remove(); if(it.id&&typeof openDetail==='function') openDetail(it.id); };
      p.appendChild(row);
    });
  }).catch(function(e){ p.appendChild(kjEl('div','','榜单接口失败: '+e)); });
}

/* ---- 继续观看 ---- */
function kjHist(){ try{ return JSON.parse(localStorage.getItem(KJ.histKey)||'{}'); }catch(e){ return {}; } }
function kjSaveHist(o){ try{ var h=kjHist(); h[o.id]=o; var a=Object.keys(h).map(function(k){return h[k];}).sort(function(x,y){return (y.t||0)-(x.t||0);}).slice(0,30); localStorage.setItem(KJ.histKey, JSON.stringify(a.reduce(function(m,v){m[v.id]=v;return m;},{}))); }catch(e){} }
function kjRemember(id,title,poster,token,label){
  if(!id) return; kjSaveHist({id:id,title:title||'',poster:poster||'',token:token||'',label:label||'',t:Date.now()});
}
function openHist(){
  var p=document.getElementById('kjHist'); if(p){ p.remove(); return; }
  p=kjEl('div'); p.id='kjHist';
  p.style.cssText='position:fixed;right:18px;top:64px;width:340px;max-height:70vh;overflow:auto;background:#171a21;border:1px solid #252a34;border-radius:10px;padding:14px;z-index:80;box-shadow:0 8px 30px rgba(0,0,0,.5)';
  var hd=kjEl('div','','继续观看'); hd.style.cssText='font-weight:700;margin-bottom:10px;color:#e8b44a'; p.appendChild(hd);
  var arr=Object.keys(kjHist()).map(function(k){return kjHist()[k];}).sort(function(x,y){return (y.t||0)-(x.t||0);});
  if(!arr.length){ p.appendChild(kjEl('div','','还没有观看记录')); }
  arr.forEach(function(it){
    var row=kjEl('div'); row.style.cssText='display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid #252a34;cursor:pointer';
    row.appendChild(kjEl('div','',it.title||'?')).style.cssText='flex:1;font-size:13px';
    row.appendChild(kjEl('div','',it.label||'')).style.cssText='font-size:11px;color:#8b8579';
    row.onclick=function(){ p.remove(); if(typeof openDetail==='function'&&it.id) openDetail(it.id); };
    p.appendChild(row);
  });
  var clr=kjEl('button','','清空记录'); clr.style.cssText='margin-top:10px;background:#1b1f27;border:1px solid #252a34;color:#e9e6df;padding:6px 12px;border-radius:7px;cursor:pointer';
  clr.onclick=function(){ localStorage.removeItem(KJ.histKey); p.remove(); };
  p.appendChild(clr);
  document.body.appendChild(p);
}

/* ---- 倍速 ---- */
function renderRate(){
  var v=document.getElementById('v'); if(!v) return;
  var box=document.getElementById('kjRate');
  if(!box){ box=kjEl('div'); box.id='kjRate'; box.style.cssText='display:flex;gap:6px;align-items:center;margin:8px 0;flex-wrap:wrap';
    [0.5,0.75,1,1.25,1.5,2].forEach(function(r){
      var b=kjEl('button','',r+'x'); b.dataset.rate=r;
      b.style.cssText='background:#1b1f27;border:1px solid #252a34;color:#e9e6df;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:12px';
      b.onclick=function(){ applyRate(r); };
      box.appendChild(b);
    });
    var wrap=v.parentNode; wrap.insertBefore(box, v.nextSibling);
  }
  Array.prototype.forEach.call(box.querySelectorAll('button'), function(b){
    var on = parseFloat(b.dataset.rate)===KJ.rate;
    b.style.background = on ? '#e8b44a' : '#1b1f27';
    b.style.color = on ? '#1a1200' : '#e9e6df';
  });
}
function applyRate(r){
  KJ.rate=r; var v=document.getElementById('v'); if(v){ try{ v.playbackRate=r; v.defaultPlaybackRate=r; }catch(e){} }
  renderRate(); kjToast('倍速 '+r+'x');
}
function initRate(){ var v=document.getElementById('v'); if(v){ try{ v.playbackRate=KJ.rate; }catch(e){} } renderRate(); }

/* ---- 热词联想 ---- */
var kjSUG=null, kjSUGT=0;
function kjSuggest(q){
  var box=document.getElementById('kjSug'); if(!box) return;
  if(!q){ box.innerHTML=''; box.style.display='none'; return; }
  clearTimeout(kjSUGT);
  kjSUGT=setTimeout(function(){
    fetch('/api/hotwords').then(function(r){return r.json();}).then(function(d){
      var words=((d&&d.words)||[]).filter(function(w){ return w.indexOf(q)>=0 || q.length<2; });
      if(!words.length) words=((d&&d.words)||[]);
      if(!words.length){ box.style.display='none'; return; }
      box.innerHTML='';
      box.style.cssText='position:absolute;top:100%;left:0;right:0;background:#171a21;border:1px solid #252a34;border-radius:8px;margin-top:4px;z-index:70;overflow:hidden';
      words.slice(0,8).forEach(function(w){
        var it=kjEl('div','',w); it.style.cssText='padding:7px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid #1f232b';
        it.onmouseover=function(){it.style.background='#1b1f27';}; it.onmouseout=function(){it.style.background='';};
        it.onclick=function(){ var inp=document.getElementById('q'); if(inp) inp.value=w; box.style.display='none'; if(typeof doSearch==='function') doSearch(); };
        box.appendChild(it);
      });
      box.style.display='block';
    }).catch(function(){ box.style.display='none'; });
  }, 180);
}
function initSuggest(){
  var inp=document.getElementById('q'); if(!inp) return;
  var host=inp.parentNode; if(host && getComputedStyle(host).position==='static') host.style.position='relative';
  var box=kjEl('div'); box.id='kjSug'; box.style.display='none'; host.appendChild(box);
  inp.setAttribute('autocomplete','off');
  inp.addEventListener('input', function(){ kjSuggest(inp.value.trim()); });
  inp.addEventListener('blur', function(){ setTimeout(function(){ box.style.display='none'; }, 160); });
}

/* ---- 线路在线上预检 ---- */
function kjProbeLine(url){
  if(!url) return Promise.resolve('?');
  return fetch('/proxy?probe=1&u='+encodeURIComponent(url)).then(function(r){ return r.status===200 ? 'on' : ('http'+r.status); }).catch(function(){ return 'err'; });
}
function kjCheckLines(){
  var lines=document.querySelectorAll('#lines .ln'); var i=0;
  function next(){
    if(i>=lines.length) { kjToast('线路预检完成'); return; }
    var n=lines[i++]; var url=n.dataset.url; if(!url){ next(); return; }
    var st=n.querySelector('.st'); if(st) st.textContent='…';
    kjProbeLine(url).then(function(s){ if(st){ st.textContent = s==='on' ? '在线' : s; st.style.color = s==='on' ? '#6ee7a8' : '#e88a8a'; } next(); });
  }
  next();
}

/* ---- 初始化：把新按钮挂到顶栏 ---- */
function kjInit(){
  initRate(); initSuggest();
  var bar=document.querySelector('header .bar'); if(!bar) return;
  if(document.getElementById('kjNav')) return;
  var nav=kjEl('div'); nav.id='kjNav'; nav.style.cssText='display:flex;gap:8px';
  [['榜单',openRank],['继续观看',openHist]].forEach(function(p){
    var b=kjEl('button','',p[0]);
    b.style.cssText='background:#1b1f27;border:1px solid #252a34;color:#e9e6df;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:13px';
    b.onclick=p[1]; nav.appendChild(b);
  });
  bar.appendChild(nav);
}
document.addEventListener('DOMContentLoaded', function(){ setTimeout(kjInit, 60); });
setTimeout(kjInit, 400);
/* ===== /KANJU_UI_PATCH ===== */

</script>

<!-- ===== KANJU_UI_V3 START ===== -->
<script>
/* ===== KANJU_UI_V2 part C：播放器增强（记忆续看 / 全屏 / 画中画 / 投屏 / 收藏 / 历史页 / 分享） ===== */
(function(){
  var KJ3 = {};
  var LS_RESUME = 'kjResume', LS_FAV = 'kjFav', LS_HIST = 'kjHist';

  function jget(k, d){ try{ return JSON.parse(localStorage.getItem(k)) || d; }catch(e){ return d; } }
  function jset(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

  function toast(msg){
    var t = document.getElementById('kjToast');
    if(!t){
      t = document.createElement('div'); t.id = 'kjToast';
      t.style.cssText = 'position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#e9e6df;padding:10px 18px;border-radius:8px;font-size:13px;z-index:9999;opacity:0;transition:.25s;pointer-events:none';
      document.body.appendChild(t);
    }
    t.textContent = msg; t.style.opacity = '1';
    clearTimeout(t._t); t._t = setTimeout(function(){ t.style.opacity = '0'; }, 1800);
  }
  KJ3.toast = toast;

  /* ---- 记忆续看：存 token + 集数 + 时间点 ---- */
  KJ3.saveResume = function(token, epTitle, tid, curTitle, time){
    var all = jget(LS_RESUME, {});
    all[token] = {token: token, epTitle: epTitle || '', tid: tid || '', title: curTitle || '',
                  time: time || 0, ts: Date.now()};
    jset(LS_RESUME, all);
    var h = jget(LS_HIST, []);
    h = h.filter(function(x){ return x.token !== token; });
    h.unshift(all[token]);
    jset(LS_HIST, h.slice(0, 60));
  };
  KJ3.getResume = function(token){ return jget(LS_RESUME, {})[token] || null; };
  KJ3.history = function(){ return jget(LS_HIST, []); };

  /* ---- 收藏 ---- */
  KJ3.isFav = function(id){ return jget(LS_FAV, []).some(function(x){ return x.id === id; }); };
  KJ3.toggleFav = function(item){
    var a = jget(LS_FAV, []);
    var i = a.findIndex(function(x){ return x.id === item.id; });
    if(i >= 0){ a.splice(i,1); toast('已取消收藏'); }
    else { a.unshift(item); toast('已收藏'); }
    jset(LS_FAV, a.slice(0, 200));
    return KJ3.isFav(item.id);
  };

  /* ---- 播放器按钮条 ---- */
  function btn(text, fn, title){
    var b = document.createElement('button');
    b.textContent = text;
    if(title) b.title = title;
    b.style.cssText = 'background:#1b1f27;border:1px solid #252a34;color:#e9e6df;padding:6px 12px;border-radius:7px;cursor:pointer;font-size:12.5px';
    b.onclick = fn;
    return b;
  }

  function ensureBar(){
    var v = document.getElementById('v');
    if(!v) return null;
    var old = document.getElementById('kjPlayerBar');
    if(old) return old;
    var bar = document.createElement('div');
    bar.id = 'kjPlayerBar';
    bar.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 6px;align-items:center';
    v.parentNode.insertBefore(bar, v.nextSibling);
    return bar;
  }

  KJ3.decorate = function(token, epTitle, tid, curTitle){
    var v = document.getElementById('v');
    if(!v) return;
    var bar = ensureBar();
    if(!bar) return;
    bar.innerHTML = '';

    /* 全屏 */
    bar.appendChild(btn('全屏', function(){
      var vv = document.getElementById('v');
      if(document.fullscreenElement){ document.exitFullscreen(); }
      else if(vv.requestFullscreen){ vv.requestFullscreen(); }
      else if(vv.webkitRequestFullscreen){ vv.webkitRequestFullscreen(); }
      else toast('当前浏览器不支持全屏');
    }, '全屏播放（F）'));

    /* 画中画 */
    bar.appendChild(btn('画中画', function(){
      var vv = document.getElementById('v');
      if(document.pictureInPictureElement){ document.exitPictureInPicture(); }
      else if(vv.requestPictureInPicture){ vv.requestPictureInPicture().catch(function(){ toast('画中画启动失败'); }); }
      else toast('当前浏览器不支持画中画');
    }));

    /* 投屏 */
    bar.appendChild(btn('投屏', function(){
      var vv = document.getElementById('v');
      if(vv.remote && vv.remote.prompt){ vv.remote.prompt().catch(function(){}); }
      else toast('当前浏览器不支持投屏（需 Chrome + 同一局域网设备）');
    }));

    /* 倍速（若原页面没有） */
    if(!document.getElementById('kjRate')){
      var sel = document.createElement('select');
      sel.id = 'kjRate';
      sel.style.cssText = 'background:#1b1f27;border:1px solid #252a34;color:#e9e6df;padding:6px 10px;border-radius:7px;font-size:12.5px';
      [0.5,0.75,1,1.25,1.5,2].forEach(function(r){
        var o = document.createElement('option'); o.value = r; o.textContent = r + 'x';
        if(r === 1) o.selected = true; sel.appendChild(o);
      });
      sel.onchange = function(){ var vv = document.getElementById('v'); if(vv) vv.playbackRate = parseFloat(sel.value); };
      bar.appendChild(sel);
    }

    /* 收藏 */
    var favItem = {id: token, title: curTitle || '', ep: epTitle || '', ts: Date.now()};
    var fb = btn(KJ3.isFav(token) ? '★ 已收藏' : '☆ 收藏', function(){
      var on = KJ3.toggleFav(favItem);
      fb.textContent = on ? '★ 已收藏' : '☆ 收藏';
    });
    bar.appendChild(fb);

    /* 分享 */
    bar.appendChild(btn('分享', function(){
      var url = location.origin + '/?token=' + encodeURIComponent(token);
      if(navigator.share){ navigator.share({title: curTitle || '看剧AI', url: url}).catch(function(){}); }
      else if(navigator.clipboard){ navigator.clipboard.writeText(url).then(function(){ toast('播放链接已复制'); }); }
      else { window.prompt('复制此链接分享', url); }
    }));

    /* 续看恢复 */
    var rs = KJ3.getResume(token);
    if(rs && rs.time > 5 && rs.epTitle === (epTitle || '')){
      var rb = btn('继续上次 ' + fmtT(rs.time), function(){
        var vv = document.getElementById('v');
        if(vv){ vv.currentTime = rs.time; vv.play().catch(function(){}); }
      });
      rb.style.borderColor = '#e8b44a';
      bar.appendChild(rb);
    }

    /* 定时存进度 */
    if(v._kjBound) return;
    v._kjBound = true;
    setInterval(function(){
      var vv = document.getElementById('v');
      if(!vv || vv.paused || !vv.currentTime) return;
      var t = window.__kjCur;
      if(t) KJ3.saveResume(t.token, t.ep, t.tid, t.title, Math.floor(vv.currentTime));
    }, 5000);
    v.addEventListener('pause', function(){
      var vv = document.getElementById('v');
      var t = window.__kjCur;
      if(t && vv && vv.currentTime) KJ3.saveResume(t.token, t.ep, t.tid, t.title, Math.floor(vv.currentTime));
    });
  };
  KJ3.fmtT = fmtT;
  function fmtT(s){ s = Math.floor(s||0); var m = Math.floor(s/60); return (m<10?'0':'')+m+':'+((s%60)<10?'0':'')+(s%60); }

  /* ---- 历史页 / 收藏页 ---- */
  function pageBox(title){
    var home = document.getElementById('home'), det = document.getElementById('detail');
    if(det) det.style.display = 'none';
    if(!home) return null;
    home.style.display = 'block';
    home.innerHTML = '';
    var sec = document.createElement('div'); sec.className = 'sec';
    var h2 = document.createElement('h2'); h2.textContent = title;
    sec.appendChild(h2);
    home.appendChild(sec);
    return sec;
  }

  KJ3.openHistory = function(){
    var sec = pageBox('观看历史（本机记录）');
    if(!sec) return;
    var h = KJ3.history();
    if(!h.length){ sec.appendChild(document.createTextNode('还没有观看记录')); return; }
    var row = document.createElement('div'); row.className = 'row';
    h.forEach(function(x){
      var d = document.createElement('div'); d.className = 'card';
      d.innerHTML = '<div class="t">' + (x.title || x.token).replace(/[<>&]/g, '') + '</div>' +
                    '<div class="s">' + (x.epTitle || '') + ' · 看至 ' + fmtT(x.time) + '</div>';
      d.onclick = function(){ if(window.openDetail) openDetail(x.tid || x.token); };
      row.appendChild(d);
    });
    sec.appendChild(row);
  };

  KJ3.openFav = function(){
    var sec = pageBox('我的收藏');
    if(!sec) return;
    var a = jget(LS_FAV, []);
    if(!a.length){ sec.appendChild(document.createTextNode('还没有收藏')); return; }
    var row = document.createElement('div'); row.className = 'row';
    a.forEach(function(x){
      var d = document.createElement('div'); d.className = 'card';
      d.innerHTML = '<div class="t">' + (x.title || x.id).replace(/[<>&]/g, '') + '</div><div class="s">点击播放</div>';
      d.onclick = function(){ if(window.openDetail) openDetail(x.id); };
      row.appendChild(d);
    });
    sec.appendChild(row);
  };

  /* ---- 顶栏按钮 ---- */
  function init(){
    var bar = document.querySelector('header .bar');
    if(!bar || document.getElementById('kjNav3')) return;
    var nav = document.createElement('div');
    nav.id = 'kjNav3';
    nav.style.cssText = 'display:flex;gap:8px';
    [['历史', KJ3.openHistory], ['收藏', KJ3.openFav]].forEach(function(p){
      var b = btn(p[0], p[1]);
      nav.appendChild(b);
    });
    bar.appendChild(nav);
  }
  document.addEventListener('DOMContentLoaded', function(){ setTimeout(init, 120); });
  setTimeout(init, 600);
  window.KJ3 = KJ3;
})();

/* ===== KJ3_SERVER_SYNC START ===== */
/* 收藏 / 历史 / 续看：登录后走会员接口（跟账号走，换机也在）；游客仍用 localStorage */
(function(){
  if(!window.KJ3) return;
  var K = window.KJ3;
  var _isFav = K.isFav, _toggleFav = K.toggleFav, _history = K.history;

  function logged(){ return !!(window.KJ4 && window.KJ4.me && window.KJ4.me()); }
  function cidOf(x){ return String(x && (x.id || x.cid || x.token) || ""); }

  /* 收藏：本地写一份做即时反馈，登录时同步写服务器 */
  K.toggleFav = function(item){
    var on = _toggleFav(item);
    if(logged()){
      var cid = cidOf(item);
      if(cid && window.KJ4.favToggle){
        window.KJ4.favToggle(item).then(function(){ /* 服务器已写 */ });
      }
    }
    return on;
  };

  /* 续看/历史：KJ3.saveResume 已经写了 localStorage，这里再补写服务器 */
  var _saveResume = K.saveResume;
  K.saveResume = function(token, epTitle, tid, curTitle, time){
    _saveResume(token, epTitle, tid, curTitle, time);
    if(logged() && window.KJ4.histPut){
      window.KJ4.histPut({
        cid: String(tid || token || ""),
        title: curTitle || "",
        episode: epTitle || "",
        position: Number(time) || 0,
        duration: 0,
        poster: ""
      });
    }
  };

  /* 历史页：登录态下用服务器数据渲染 */
  var _openHistory = K.openHistory;
  K.openHistory = function(){
    if(!logged()) return _openHistory();
    var home = document.getElementById('home'), det = document.getElementById('detail');
    if(det) det.style.display = 'none';
    if(!home) return;
    home.style.display = 'block';
    home.innerHTML = '';
    var sec = document.createElement('div'); sec.className = 'sec';
    var h2 = document.createElement('h2'); h2.textContent = '观看历史（会员账号 · 跟账号走）';
    sec.appendChild(h2);
    home.appendChild(sec);
    window.KJ4.histList().then(function(items){
      if(!items.length){ sec.appendChild(document.createTextNode('还没有观看记录')); return; }
      var row = document.createElement('div'); row.className = 'row';
      items.forEach(function(x){
        var d = document.createElement('div'); d.className = 'card';
        d.innerHTML = '<div class="t">' + String(x.title || x.cid || '').replace(/[<>&]/g,'') + '</div>' +
                      '<div class="s">' + String(x.episode || '').replace(/[<>&]/g,'') + ' · 看至 ' +
                      fmtSec(x.position) + '</div>';
        d.onclick = function(){ if(window.openDetail) openDetail(x.cid); };
        row.appendChild(d);
      });
      sec.appendChild(row);
    }).catch(function(){ sec.appendChild(document.createTextNode('加载失败，请重试')); });
  };

  /* 收藏页：登录态下用服务器数据渲染 */
  var _openFav = K.openFav;
  K.openFav = function(){
    if(!logged()) return _openFav();
    var home = document.getElementById('home'), det = document.getElementById('detail');
    if(det) det.style.display = 'none';
    if(!home) return;
    home.style.display = 'block';
    home.innerHTML = '';
    var sec = document.createElement('div'); sec.className = 'sec';
    var h2 = document.createElement('h2'); h2.textContent = '我的收藏（会员账号 · 跟账号走）';
    sec.appendChild(h2);
    home.appendChild(sec);
    window.KJ4.favList().then(function(items){
      if(!items.length){ sec.appendChild(document.createTextNode('还没有收藏')); return; }
      var row = document.createElement('div'); row.className = 'row';
      items.forEach(function(x){
        var d = document.createElement('div'); d.className = 'card';
        d.innerHTML = '<div class="t">' + String(x.title || x.cid || '').replace(/[<>&]/g,'') + '</div>' +
                      '<div class="s">点击播放 · 取消收藏点 ×</div>';
        var xb = document.createElement('span'); xb.textContent = '×';
        xb.style.cssText = 'position:absolute;right:6px;top:6px;background:rgba(0,0,0,.6);color:#fff;' +
          'width:20px;height:20px;border-radius:50%;text-align:center;line-height:20px;cursor:pointer;z-index:2';
        d.style.position = 'relative';
        xb.onclick = function(e){

        row.appendChild(d);
      });
      sec.appendChild(row);
    }).catch(function(){ sec.appendChild(document.createTextNode('加载失败，请重试')); });
  };

  function fmtSec(t){
    t = Math.max(0, Math.floor(Number(t)||0));
    var m = Math.floor(t/60), ss = t%60;
    return m + ':' + (ss<10?'0':'') + ss;
  }

  /* 登录状态变化后刷新按钮/页面 */
  K.refresh = function(){
    if(window.KJ4 && window.KJ4.refresh) return window.KJ4.refresh();
    return Promise.resolve(null);
  };
})();

<script>
/* ===== KANJU V2 FINAL：单一 KJ2 状态，频道导航 / 筛选面板 / 列表分页 / 排序 / 日历 / 播放器增强 ===== */
(function(){
  "use strict";
  var KJ2 = window.KJ2 = window.KJ2 || {};
  KJ2.channels = KJ2.channels || [];
  KJ2.catalogs  = KJ2.catalogs  || {};
  KJ2.state = { kind:'recommend', page:1, filters:{}, sort:'', window:'' };
  KJ2.loaded = false;

  function el(t,c,x){ var e=document.createElement(t); if(c)e.className=c; if(x!==undefined&&x!==null)e.innerHTML=x; return e; }
  function esc(s){ return String(s==null?'':s).replace(/[<>&"]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c];}); }
  function $(id){ return document.getElementById(id); }
  function toast(m){
    var d = $('kj2toast');
    if(!d){ d = el('div'); d.id='kj2toast';
      d.style.cssText='position:fixed;left:50%;bottom:48px;transform:translateX(-50%);background:#1b1f27;border:1px solid #2b3140;color:#e9e6df;padding:10px 16px;border-radius:10px;z-index:9999;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.5)';
      document.body.appendChild(d); }
    d.textContent = m; d.style.display='block';
    clearTimeout(KJ2._tt); KJ2._tt = setTimeout(function(){ d.style.display='none'; }, 2000);
  }
  KJ2.toast = toast;

  var DEFAULT_CH = [
    {key:'recommend',  label:'AI找剧'},
    {key:'updates',    label:'最近更新'},
    {key:'series',     label:'电视剧'},
    {key:'movie',      label:'电影'},
    {key:'anime',      label:'动漫'},
    {key:'variety',    label:'综艺'},
    {key:'short_drama',label:'短剧'}
  ];

  /* ---------- 载入频道与筛选契约 ---------- */
  KJ2.loadUI = function(){
    if(KJ2.loaded) return Promise.resolve(KJ2);
    return fetch('/api/catalog_ui').then(function(r){ return r.json(); }).then(function(d){
      KJ2.channels = (d && d.channels && d.channels.length) ? d.channels : DEFAULT_CH;
      KJ2.catalogs = (d && d.catalogs) || {};
      KJ2.loaded = true;
      return KJ2;
    }).catch(function(){ KJ2.channels = DEFAULT_CH; KJ2.loaded = true; return KJ2; });
  };

  /* ---------- 1) 频道导航 ---------- */
  KJ2.mountChannels = function(){
    var old = $('kjChannels'); if(old) old.remove();
    var bar = document.querySelector('header .bar'); if(!bar) return;
    var nav = el('div'); nav.id='kjChannels'; nav.className='kjch';
    var chs = KJ2.channels.length ? KJ2.channels : DEFAULT_CH;
    chs.forEach(function(c){
      var b = el('button','kjchb'+(c.key===KJ2.state.kind?' on':''), esc(c.label));
      b.dataset.kind = c.key;
      b.onclick = function(){ KJ2.openChannel(c.key); };
      nav.appendChild(b);
    });
    var home = el('button','kjchb'+(KJ2.state.kind==='recommend'?' on':''), '首页');
    home.onclick = function(){ KJ2.goHome(); };
    nav.insertBefore(home, nav.firstChild);
    bar.appendChild(nav);
  };

  /* ---------- 2) 筛选面板 ---------- */
  KJ2.buildFilters = function(host, kind){
    host.innerHTML = '';
    var cat = KJ2.catalogs[kind];
    if(!cat || !cat.rows || !cat.rows.length){ host.style.display='none'; return; }
    host.style.display='block';
    cat.rows.forEach(function(row){
      if(!row.options || !row.options.length) return;
      var line = el('div','kjfrow');
      line.appendChild(el('span','kjflab', esc(row.label || row.key)));
      var all = el('button','kjfi'+(KJ2.state.filters[row.key]?'':' on'), '全部');
      all.onclick = function(){ delete KJ2.state.filters[row.key]; delete KJ2.state.filters['__p_'+row.key]; KJ2.state.page=1; KJ2.renderCatalog(); };
      line.appendChild(all);
      row.options.forEach(function(o){
        var on = KJ2.state.filters[row.key] === o.key;
        var b = el('button','kjfi'+(on?' on':''), esc(o.label || o.key));
        b.onclick = function(){
          KJ2.state.filters[row.key] = o.key;
          KJ2.state.filters['__p_'+row.key] = o.params || {};
          KJ2.state.page = 1; KJ2.renderCatalog();
        };
        line.appendChild(b);
      });
      host.appendChild(line);
    });
  };

  /* ---------- 3) 列表页（分页 + 排序） ---------- */
  KJ2.label = function(k){
    var chs = KJ2.channels.length ? KJ2.channels : DEFAULT_CH;
    for(var i=0;i<chs.length;i++){ if(chs[i].key===k) return chs[i].label; }
    return k === 'recommend' ? '全部' : (k === 'updates' ? '最近更新' : k);
  };

  KJ2.query = function(){
    var s = KJ2.state;
    var q = ['kind='+encodeURIComponent(s.kind==='recommend'||s.kind==='updates' ? 'all' : s.kind),
             'page='+s.page];
    if(s.sort)   q.push('sort='+encodeURIComponent(s.sort));
    if(s.window) q.push('window='+encodeURIComponent(s.window));
    Object.keys(s.filters).forEach(function(k){
      if(k.indexOf('__p_')===0) return;
      var p = s.filters['__p_'+k];
      if(p && Object.keys(p).length){ Object.keys(p).forEach(function(pk){ q.push(encodeURIComponent(pk)+'='+encodeURIComponent(p[pk])); }); }
      else { q.push(encodeURIComponent(k)+'='+encodeURIComponent(s.filters[k])); }
    });
    return q.join('&');
  };

  KJ2.renderCatalog = function(){
    var det = $('detail'); if(det) det.style.display='none';
    var home = $('home'); if(!home) return;
    home.style.display = 'block';
    home.innerHTML = '';

    var sec = el('div','sec');
    var sorts = [['','默认'],['heat_desc','最热'],['updated_desc','最新'],['latest','最新上架']];
    var curSort = '默认';
    sorts.forEach(function(s){ if(s[0]===KJ2.state.sort) curSort = s[1]; });

    var head = el('div','kjhead');
    head.appendChild(el('h2',null, esc(KJ2.label(KJ2.state.kind)) +
      ' <span style="font-size:12px;color:#8a857a;font-weight:400">第 '+KJ2.state.page+' 页</span>'));
    var sortBtn = el('button','kjsort','排序：'+curSort);
    sortBtn.onclick = function(){
      var order = ['','heat_desc','updated_desc'];
      var i = order.indexOf(KJ2.state.sort);
      KJ2.state.sort = order[(i+1)%order.length];
      KJ2.state.page = 1; KJ2.renderCatalog();
    };
    head.appendChild(sortBtn);
    sec.appendChild(head);

    /* KJ_WINDOW_PATCH: 时间窗按钮（原站 window 参数） */
    var wins = [['','全部时间'],['day','今日'],['week','本周'],['month','本月']];
    var wbar = el('div','kjwindow');
    wbar.style.cssText='display:flex;gap:8px;flex-wrap:wrap;padding:6px 0;align-items:center';
    wbar.appendChild(el('span',null,'时间窗：')).style.cssText='color:#7d8794;font-size:12px';
    wins.forEach(function(w){
      var on = (KJ2.state.window||'')===w[0];
      var b = el('button','kjfi'+(on?' on':''), w[1]);
      b.setAttribute('data-window', w[0]);
      b.onclick = function(){ KJ2.state.window = w[0]; KJ2.state.page = 1; KJ2.renderCatalog(); };
      wbar.appendChild(b);
    });
    sec.appendChild(wbar);

    var panel = el('div','kjfilters');
    sec.appendChild(panel);
    KJ2.buildFilters(panel, KJ2.state.kind==='recommend'||KJ2.state.kind==='updates' ? 'all' : KJ2.state.kind);

    var row = el('div','row'); row.id = 'kjList';
    row.innerHTML = '<div id="msg">加载中…</div>';
    sec.appendChild(row);

    var pager = el('div','kjpager'); pager.id = 'kjPager';
    sec.appendChild(pager);
    home.appendChild(sec);
    if(window.scrollTo) window.scrollTo({top:0,behavior:'smooth'});

    fetch('/api/browse?'+KJ2.query()).then(function(r){ return r.json(); }).then(function(d){
      row.innerHTML = '';
      var items = (d && (d.items || d.list)) || [];
      if(!items.length) row.innerHTML = '<div id="msg">没有匹配的影片</div>';
      items.forEach(function(c){
        var card_ = el('div','card');
        card_.innerHTML = '<img loading="lazy" src="'+esc(c.poster||'')+'" onerror="this.style.opacity=.12"/><div class="t">'+esc(c.title||'')+'</div><div class="s">'+esc(c.remarks||'')+'</div>';
        card_.onclick = function(){ if(window.openDetail) window.openDetail(c.id); };
        row.appendChild(card_);
      });
      pager.innerHTML = '';
      var prev = el('button','kjpg','← 上一页'); prev.disabled = KJ2.state.page<=1;
      prev.onclick = function(){ if(KJ2.state.page>1){ KJ2.state.page--; KJ2.renderCatalog(); } };
      var info = el('span','kjdim',' 第 '+KJ2.state.page+' 页 · 本页 '+items.length+' 部'+(d.total?(' / 共 '+d.total):'')+' ');
      var next = el('button','kjpg','下一页 →');
      next.onclick = function(){ KJ2.state.page++; KJ2.renderCatalog(); };
      pager.appendChild(prev); pager.appendChild(info); pager.appendChild(next);
    }).catch(function(e){ row.innerHTML = '<div id="msg">加载失败：'+esc(e.message||e)+'</div>'; });
  };

  KJ2.openChannel = function(kind){
    KJ2.state.kind = kind; KJ2.state.page = 1; KJ2.state.filters = {};
    var _cat = KJ2.catalogs[kind];
    KJ2.state.sort = (_cat && _cat.default_sort) ? _cat.default_sort : '';
    KJ2.state.window = '';
    var chs = document.querySelectorAll('#kjChannels .kjchb');
    for(var i=0;i<chs.length;i++){ chs[i].classList.toggle('on', chs[i].dataset.kind===kind); }
    KJ2.renderCatalog();
  };

  KJ2.goHome = function(){
    KJ2.state.kind='recommend'; KJ2.state.page=1; KJ2.state.filters={}; KJ2.state.sort='';
    var home = $('home'), det = $('detail');
    if(det) det.style.display='none';
    if(home){ home.style.display='block'; }
    var chs = document.querySelectorAll('#kjChannels .kjchb');
    for(var i=0;i<chs.length;i++){ chs[i].classList.remove('on'); }
    if(window.loadHome) window.loadHome();
  };

  window.kj2OpenHome = KJ2.goHome;
  window.kj2OpenCatalog = KJ2.openChannel;

  /* ---------- 初始化 ---------- */
  function boot(){
    KJ2.loadUI().then(function(){ KJ2.mountChannels(); });
  }
  if(document.readyState === 'loading'){ document.addEventListener('DOMContentLoaded', function(){ setTimeout(boot, 80); }); }
  else { setTimeout(boot, 80); }
  setTimeout(boot, 500);
})();


/* EXPORT_FIX */ try{ window.openDetail = openDetail; window.goHome = goHome; window.KJ2 = window.KJ2; }catch(e){ console.error('export',e); }
</script>

(function(){

    t.style.cssText='position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#e9e6df;padding:10px 18px;border-radius:8px;font-size:13px;z-index:10002';

    if(o.body&&typeof o.body!=='string'){ o.headers['Content-Type']='application/json'; o.body=JSON.stringify(o.body); }
    return fetch(API+u,o).then(function(r){ return r.json().catch(function(){return{};}); }); }

  /* ---------- 认证 ---------- */
  function openAuth(m){

    $('kjAuthTitle').textContent = mode==='login'?'登录 看剧AI':'注册 看剧AI';
    $('kjAuthTip').textContent = mode==='login'?'登录后收藏、观看历史、进度会跟随账号':'注册需邀请码；注册后自动登录';

    $('kjAuthSw').innerHTML = mode==='login'?'还没有账号？<a id="kjAuthToggle">立即注册</a>':'已有账号？<a id="kjAuthToggle">去登录</a>';

  function closeAuth(){ $('kjAuthMask').style.display='none'; }

  function doAuth(){
    var acc=$('kjAuthAcc').value.trim(), pwd=$('kjAuthPwd').value;
    if(!acc||!pwd){ $('kjAuthErr').textContent='请填写账号和密码'; return; }
    var body={account:acc,password:pwd};
    if(mode==='register') body.invite_code=$('kjAuthInv').value.trim();
    $('kjAuthBtn').disabled=true;
    req(mode==='login'?'/auth/login':'/auth/register',{method:'POST',body:body}).then(function(d){
      $('kjAuthBtn').disabled=false;
      if(!d.ok){ $('kjAuthErr').textContent=d.error||'操作失败'; return; }
      me=d.user; closeAuth(); renderUser(); toast(mode==='login'?'已登录':'注册成功，已登录');
      syncLocalToServer();
      if(window.KJ3&&KJ3.refresh) KJ3.refresh();
    }).catch(function(){ $('kjAuthBtn').disabled=false; $('kjAuthErr').textContent='网络错误'; });
  }

  /* ---------- 顶栏用户区 ---------- */
  function renderUser(){
    var nav=$('kjUserNav');
    if(!nav){ nav=document.createElement('div'); nav.id='kjUserNav'; nav.className='kjuser';
      var bar=document.querySelector('header .bar'); if(bar) bar.appendChild(nav); }
    nav.innerHTML='';
    if(!me){
      var b=document.createElement('button'); b.className='pri'; b.textContent='登录 / 注册';
      b.onclick=function(){ openAuth('login'); }; nav.appendChild(b);
      var m=document.createElement('button'); m.textContent='🌙 18+';
      m.onclick=function(){ goMidnight(); }; nav.appendChild(m);
    } else {
      var nm=document.createElement('span'); nm.className='nm'; nm.textContent=(me.nickname||me.account);
      nm.title='等级 Lv.'+me.level+' · 词元 '+me.tokens+' · 成长 '+me.growth; nav.appendChild(nm);
      var a=document.createElement('button'); a.className=me.adult_confirmed?'adult':'';
      a.textContent=me.adult_confirmed?'🌙 午夜剧场':'🌙 18+';
      a.onclick=function(){ goMidnight(); }; nav.appendChild(a);
      var o=document.createElement('button'); o.textContent='退出';
      o.onclick=function(){ req('/auth/logout',{method:'POST'}).then(function(){ me=null; renderUser(); toast('已退出'); if(window.KJ3&&KJ3.refresh) KJ3.refresh(); }); };
      nav.appendChild(o);
    }
  }

  /* ---------- 18+ 入口 ---------- */
  function goMidnight(){
    if(!me){ toast('请先登录后再进入午夜剧场'); openAuth('login'); return; }
    req('/midnight/state').then(function(d){
      if(d.state==='unlocked'){ location.href='/midnight-theater'; return; }
      $('kjAdultMask').style.display='flex';
    });
  }
  function confirmAdult(){
    req('/auth/adult',{method:'POST',body:{adult_confirmed:true}}).then(function(d){
      $('kjAdultMask').style.display='none';
      if(d.ok){ me=d.user; renderUser(); toast('已确认成年，正在进入…'); setTimeout(function(){ location.href='/midnight-theater'; },400); }
      else { toast(d.error||'确认失败'); }
    });
  }

  /* ---------- 收藏 / 历史：本地 → 服务器 ---------- */
  function syncLocalToServer(){
    if(!me) return;
    try{
      var fav=JSON.parse(localStorage.getItem('kjFav')||'[]');
      fav.slice(0,200).forEach(function(x){
        var cid=x.id||x.cid||x.token; if(!cid) return;
        req('/fav',{method:'POST',body:{cid:String(cid),title:x.title||'',poster:x.poster||''}});
      });
      var hist=JSON.parse(localStorage.getItem('kjHist')||'[]');
      (Array.isArray(hist)?hist:[]).slice(0,60).forEach(function(x){
        var cid=x.id||x.cid||x.token; if(!cid) return;
        req('/history',{method:'POST',body:{cid:String(cid),title:x.title||'',episode:x.epTitle||'',
          position:x.time||0,duration:x.duration||0,poster:x.poster||''}});
      });
    }catch(e){}
  }

  /* ---------- 暴露 KJ4 ---------- */
  window.KJ4 = {
    me:function(){ return me; },
    openAuth:openAuth,
    goMidnight:goMidnight,
    refresh:function(){ return req('/auth/me').then(function(d){ me=d.logged_in?d.user:null; renderUser(); return me; }); },
    favList:function(){ return req('/fav').then(function(d){ return d.items||[]; }); },
    favToggle:function(item){
      if(!me){ openAuth('login'); return Promise.resolve(false); }
      var cid=String(item.id||item.cid||item.token);
      return req('/fav',{method:'POST',body:{cid:cid,title:item.title||'',poster:item.poster||''}}).then(function(d){
        return !!(d&&d.has);
      });
    },
    favDel:function(cid){ if(!me) return Promise.resolve(); return req('/fav?cid='+encodeURIComponent(cid),{method:'DELETE'}); },
    histList:function(){ return req('/history').then(function(d){ return d.items||[]; }); },
    histPut:function(o){ if(!me) return Promise.resolve(); return req('/history',{method:'POST',body:o}); },
    histClear:function(){ if(!me) return Promise.resolve(); return req('/history',{method:'DELETE'}); }
  };

  /* 事件绑定 */
  document.addEventListener('click',function(e){
    var t=e.target;
    if(t.id==='kjAuthToggle'){ openAuth(mode==='login'?'register':'login'); return; }
    if(t.id==='kjAuthClose'||t.id==='kjAuthMask'){ closeAuth(); return; }
    if(t.id==='kjAuthBtn'){ doAuth(); return; }
    if(t.id==='kjAdultNo'||t.id==='kjAdultMask'){ $('kjAdultMask').style.display='none'; toast('已返回'); return; }
    if(t.id==='kjAdultYes'){ confirmAdult(); return; }
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='Enter'){
      if($('kjAuthMask').style.display==='flex') doAuth();
    }
    if(e.key==='Escape'){ closeAuth(); $('kjAdultMask').style.display='none'; }
  });

  document.addEventListener('DOMContentLoaded',function(){ setTimeout(function(){ KJ4.refresh(); },200); });
  setTimeout(function(){ KJ4.refresh(); },700);
  window.addEventListener('load',function(){ setTimeout(function(){ KJ4.refresh(); },300); });
})();
</script>

<script>
/* ===== KJ5：对照 kanju45.com 补齐 —— 策展首页 / 片单 / 合集 / 短剧 / 个人中心 / 播放页增强 / 公告 / 分享 ===== */
(function(){
"use strict";
function $(id){ return document.getElementById(id); }
function E(t,c,h){ var e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e; }
function X(s){ return String(s==null?'':s).replace(/[<>&"]/g,function(m){return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[m];}); }
function toast(m){ if(window.KJ3&&KJ3.toast) KJ3.toast(m); else { var d=E('div',null,X(m)); d.style.cssText='position:fixed;left:50%;top:20px;transform:translateX(-50%);background:#e8b44a;color:#1a1200;padding:8px 16px;border-radius:8px;font-weight:700;z-index:99'; document.body.appendChild(d); setTimeout(function(){d.remove();},2200);} }
function req(u,o){ o=o||{}; o.headers=o.headers||{}; o.credentials='same-origin'; if(o.body&&typeof o.body!=='string'){ o.headers['Content-Type']='application/json'; o.body=JSON.stringify(o.body);} return fetch('/api'+u,o).then(function(r){ return r.json().catch(function(){return{};}); }); }
function me(){ return (window.KJ4&&KJ4.me)?KJ4.me():null; }
function needLogin(){ if(me()) return false; if(window.KJ4&&KJ4.openAuth) KJ4.openAuth('login'); toast('请先登录'); return true; }
function fmtHeat(c){ if(c.plays&&+c.plays>=10000) return (+c.plays/10000).toFixed(1)+'万 播放'; if(c.plays&&+c.plays>0) return c.plays+' 播放'; if(c.heat) return '热度 '+Math.round(+c.heat); return ''; }
function fmtTime(ts){ var d=new Date((ts||0)*1000); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }

/* ---------- 卡片 v2：三行信息 ---------- */
function card2(c,rank){
  var d=E('div','card');
  var prog = c.remarks || (c.episode_count?('共'+c.episode_count+'集'):'');
  var g = (c.genres||[]).slice(0,2).join(' / ');
  d.innerHTML = (rank?'<div class="rk">'+rank+'</div>':'')+
    '<img loading="lazy" src="'+X(c.poster||c.backdrop||'')+'" onerror="this.style.opacity=.15"/>'+
    '<div class="t">'+X(c.title||'')+'</div>'+
    '<div class="heat">'+X(fmtHeat(c))+'</div>'+
    '<div class="s">'+X([prog,(c.year||''),g].filter(Boolean).join(' · '))+'</div>';
  d.onclick=function(){ if(window.openDetail) openDetail(c.id); };
  return d;
}
function railInto(sec,items,ranked){ var row=E('div','row'); (items||[]).forEach(function(c,i){ row.appendChild(card2(c, ranked?(i+1):null)); }); sec.appendChild(row); }
function secOf(title,sub){ var s=E('div','sec'); s.appendChild(E('h2',null,X(title)+(sub?' <span>'+X(sub)+'</span>':''))); return s; }

/* ---------- 首页策展 ---------- */
var curKind='series', calCache={};
function renderWeek(sec){
  sec.innerHTML=''; sec.appendChild(E('h2',null,'本周追剧 <span>按更新排序 · 点分类切换</span>'));
  var tabs=E('div','kj5tabs');
  [['series','电视剧'],['anime','动漫'],['variety','综艺'],['movie','电影']].forEach(function(kv){
    var b=E('button','kj5tab'+(curKind===kv[0]?' on':''),kv[1]);
    b.onclick=function(){ curKind=kv[0]; renderWeek(sec); };
    tabs.appendChild(b);
  });
  sec.appendChild(tabs);
  var body=E('div',null,'<div id="msg">加载中…</div>'); sec.appendChild(body);
  var done=function(d){
    body.innerHTML='';
    var items=(d&&d.items)||[];
    if(d&&d.total!=null) sec.querySelector('h2').innerHTML='本周追剧 <span>'+X({series:'电视剧',anime:'动漫',variety:'综艺',movie:'电影'}[curKind])+' · 共 '+d.total+' 部</span>';
    if(!items.length){ body.innerHTML='<div id="msg">暂无数据</div>'; return; }
    railInto(body,items.slice(0,12));
  };
  if(calCache[curKind]) done(calCache[curKind]);
  else req('/browse?kind='+curKind+'&sort=updated_desc&limit=12&page=1').then(function(d){ calCache[curKind]=d; done(d); });
}
function renderCurated(){
  var home=$('home'); if(!home||$('kj5curated')) return;

  var hot=secOf('大家都在看','今晚打开就能接上的热播片单'); wrap.appendChild(hot);
  var rails= E('div'); rails.id='kj5rails'; wrap.appendChild(rails);
  home.insertBefore(wrap, home.firstChild);
  renderWeek(w);
  req('/rank').then(function(d){ railInto(hot,(d.items||[]).slice(0,12),true); });
  req('/home/rails').then(function(d){
    [['kr','韩剧在追','从新集开始追也不费劲'],['jp','日剧上新','节奏轻一点，夜里慢慢看'],['short','短剧精选','竖屏短剧，一口气看完']].forEach(function(r){
      var items=d[r[0]]||[]; if(!items.length) return;
      var s=secOf(r[1],r[2]); railInto(s,items.slice(0,12)); rails.appendChild(s);
    });
  });
}
var _loadHome = window.loadHome;
if(typeof _loadHome==='function'){
  window.loadHome = function(){ var p=_loadHome.apply(this,arguments); Promise.resolve(p).then(function(){ setTimeout(renderCurated,60); }); return p; };
}

/* ---------- 通用分页页（无限下滑） ---------- */
function pageBox5(title){
  var det=$('detail'); if(det){ det.style.display='none'; det.innerHTML=''; }
  var home=$('home'); home.style.display='block'; home.innerHTML='';
  var bk=E('button','back','← 返回首页'); bk.onclick=function(){ if(window.kj2OpenHome) kj2OpenHome(); else if(window.goHome) goHome(); if(window.loadHome) loadHome(); };
  home.appendChild(bk);
  var sec=secOf(title); home.appendChild(sec);
  if(window.scrollTo) window.scrollTo({top:0});
  return sec;
}
function infiniteGrid(sec, loader){
  var grid=E('div','kj5grid'); sec.appendChild(grid);
  var sen=E('div','kj5sentinel'); sec.appendChild(sen);
  var page=1, busy=false, over=false;
  function load(){
    if(busy||over) return; busy=true;
    loader(page).then(function(r){
      busy=false;
      var items=r.items||[];
      items.forEach(function(c){ grid.appendChild(card2(c)); });
      if(!items.length&&page===1) grid.innerHTML='<div id="msg">暂无内容</div>';
      if(!r.has_more||!items.length) over=true; else page++;
      if(!over&&grid.children.length&&sen.getBoundingClientRect().top<innerHeight+600) load();
    }).catch(function(){ busy=false; });
  }
  var io=new IntersectionObserver(function(es){ if(es[0].isIntersecting) load(); },{rootMargin:'600px'});
  io.observe(sen); load();
  return grid;
}
window.kj5Short = function(){
  var sec=pageBox5('短剧专区 · 竖屏短剧');
  infiniteGrid(sec,function(p){ return req('/shortdrama?page='+p).then(function(d){ return {items:d.items||[], has_more:!!d.has_more}; }); });
};
function openBrowsePage(title,params){
  var sec=pageBox5(title);
  infiniteGrid(sec,function(p){
    var qs=Object.keys(params).map(function(k){ return k+'='+encodeURIComponent(params[k]); }).join('&');
    return req('/browse?'+qs+'&page='+p+'&limit=24').then(function(d){ return {items:d.items||[], has_more:!!d.has_more}; });
  });
}
window.kj5Collections = function(){
  var sec=pageBox5('合集 · 按主题挑片');

  req('/collections').then(function(d){
    (d.items||[]).forEach(function(col){

        '<div class="t">'+X(col.label)+'</div><div class="s">'+(col.total!=null?('共 '+col.total+' 部'):'精选合集')+'</div>';
      c.onclick=function(){ openBrowsePage('合集 · '+col.label, col.params); };
      grid.appendChild(c);

    if(!grid.children.length) grid.innerHTML='<div id="msg">暂无合集</div>';

};

function shareCreate(kind,target){

/* ---------- 个人中心 ---------- */
window.kj5Me = function(){
  if(needLogin()) return;
  var sec=pageBox5('我的 · 个人中心');
  sec.appendChild(E('div',null,'<div id="msg">加载中…</div>'));
  Promise.all([req('/quota'),req('/invite/me'),req('/playlists/mine'),req('/cast/devices')]).then(function(rs){

    bp.onclick=function(){

      var body=ta.value.trim(); if(!body){ toast('评论不能为空'); return; }
      req('/comments',{method:'POST',body:{cid:cid,body:body}}).then(function(d){ if(d.ok){ ta.value=''; loadComments(); toast('已发表'); } else toast(d.error||'发表失败'); });
    };

    function loadComments(){
      req('/comments?cid='+encodeURIComponent(cid)).then(function(d){

          var u=me(); if(u&&u.id===cm.uid){ var del=E('button','kj5ab','删除'); del.style.padding='2px 9px'; del.onclick=function(){ req('/comments/'+cm.id,{method:'DELETE'}).then(function(){ loadComments(); }); }; c.appendChild(del); }

  if(!localStorage.getItem('kjDomainBarOff')){

  var main=document.querySelector('main');

    var nav=E('div'); nav.id='kj5nav';
    [['🏠 首页',function(){ if(window.kj2OpenHome) kj2OpenHome(); else if(window.goHome) goHome(); if(window.loadHome) loadHome(); }],
     ['🎬 片单广场',function(){ window.kj5Playlists(); }],

  }
  /* 分享落地 */
  var sh=new URLSearchParams(location.search).get('share');
  if(sh){
    req('/share/'+encodeURIComponent(sh)).then(function(d){
      if(!d.ok) return;
      if(d.kind==='playlist'){ var pid=parseInt(d.target,10); if(pid) openPlaylist(pid); }
      else if(d.target&&window.openDetail) openDetail(d.target);
    });
  }
  /* 公告 */
  req('/announcements').then(function(d){
    var items=d.items||[]; if(!items.length) return;
    var latest=Math.max.apply(null, items.map(function(a){ return a.version||0; }));
    if(+(localStorage.getItem('kjAnnSeen')||0)>=latest) return;
    var m=modal('<h3>📢 站点公告</h3>'+items.map(function(a){ return '<div style="margin-bottom:12px"><b>'+X(a.title)+'</b><div style="color:var(--dim);font-size:13px;margin-top:2px">'+X(a.body)+'</div></div>'; }).join('')+'<div class="rowb"><button class="kj5btn" id="annOk">知道了</button></div>');
    m.querySelector('#annOk').onclick=function(){ localStorage.setItem('kjAnnSeen',String(latest)); m.remove(); };
  });
  /* 注册：手机号 + 短信验证码（注入 KJ4 弹窗） */
  var box=$('kjAuthBox'), inv=$('kjInviteWrap');
  if(box&&inv&&!$('kjPhoneWrap')){
    var w=E('div'); w.id='kjPhoneWrap'; w.style.display='none';
    w.innerHTML='<label>手机号（可选，填了需验证码）</label><input id="kjAuthPhone" placeholder="手机号"/>'+
      '<label>短信验证码</label><div style="display:flex;gap:8px"><input id="kjAuthSms" placeholder="6 位验证码" style="flex:1"/><button class="kj5btn ghost" id="kjSmsBtn" type="button">发送验证码</button></div>';
    inv.parentNode.insertBefore(w, inv.nextSibling);
    new MutationObserver(function(){ w.style.display=inv.style.display; }).observe(inv,{attributes:true,attributeFilter:['style']});
    w.querySelector('#kjSmsBtn').onclick=function(){
      var ph=w.querySelector('#kjAuthPhone').value.trim(); if(ph.length<6){ toast('请先填手机号'); return; }
      var btn=this; btn.disabled=true;
      req('/auth/sms/send',{method:'POST',body:{phone:ph}}).then(function(d){
        if(d.ok){ toast(d.dev_code?('本地模式验证码：'+d.dev_code):'验证码已发送'); if(d.dev_code) w.querySelector('#kjAuthSms').value=d.dev_code; }
        else toast(d.error||'发送失败');
        var n=60; var iv=setInterval(function(){ n--; btn.textContent=n>0?(n+'s 后重发'):'发送验证码'; if(n<=0){ clearInterval(iv); btn.disabled=false; } },1000);
      }).catch(function(){ btn.disabled=false; });
    };
    var _fetch=window.fetch;
    window.fetch=function(u,o){
      try{
        if(typeof u==='string'&&u.indexOf('/auth/register')>-1&&o&&typeof o.body==='string'){
          var ph=w.querySelector('#kjAuthPhone').value.trim();
          if(ph){ var b=JSON.parse(o.body); b.phone=ph; b.sms_code=w.querySelector('#kjAuthSms').value.trim(); o=Object.assign({},o,{body:JSON.stringify(b)}); }
        }
      }catch(e){}
      return _fetch.call(this,u,o);
    };
  }
}

<script>
/* ===== KJ6：播放器完全对齐原站 —— 快捷键策略 / 全局偏好(线路记忆+跳过片头片尾) / 续播 / 上下集 / 连播 / PiP / 片头片尾众包标记 ===== */
(function(){
"use strict";
function $(id){ return document.getElementById(id); }
function E(t,c,h){ var e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e; }
function toast(m){ if(window.kjToast) kjToast(m); else if(window.KJ3&&KJ3.toast) KJ3.toast(m); }
function req(u,o){ o=o||{}; o.headers=o.headers||{}; o.credentials='same-origin'; if(o.body&&typeof o.body!=='string'){ o.headers['Content-Type']='application/json'; o.body=JSON.stringify(o.body);} return fetch('/api'+u,o).then(function(r){ return r.json().catch(function(){return{};}); }); }
function fmtT(s){ s=Math.max(0,Math.floor(s||0)); var m=Math.floor(s/60); return (m<10?'0':'')+m+':'+((s%60)<10?'0':'')+(s%60); }

/* ---------- 全局偏好（与原站同键名同结构） ---------- */
var PREF_KEY='aimovie.player.global-preferences.v1';
function prefs(){ try{ var p=JSON.parse(localStorage.getItem(PREF_KEY)||'null'); if(p&&typeof p==='object') return {skipIntro:p.skipIntro!==false, skipOutro:p.skipOutro!==false, official:p.official||null, ordinary:p.ordinary||null}; }catch(e){} return {skipIntro:true, skipOutro:true, official:null, ordinary:null}; }
function savePrefs(p){ try{ localStorage.setItem(PREF_KEY, JSON.stringify(p)); }catch(e){} }
function lineClass(l){ return (l&&(l.provider&&String(l.provider).indexOf('官方')>-1||l.label&&String(l.label).indexOf('官方')>-1))?'official':'ordinary'; }

/* ---------- 状态 ---------- */
var S={ token:null, playData:null, marks:null, outroDone:false, autoNext:true, rememberedApplied:null, resumeApplied:null };
try{ S.autoNext=localStorage.getItem('kjAutoNext')!=='off'; }catch(e){}

/* ---------- 包装 loadPlay：捕获播放数据、线路记忆、标记与续播 ---------- */
var _loadPlay=window.loadPlay;
if(typeof _loadPlay==='function'){
  window.loadPlay=function(token,title){
    S.token=token; S.marks=null; S.outroDone=false; S.playData=null; S.rememberedApplied=null; S.resumeApplied=null;
    var r=_loadPlay.apply(this,arguments);
    fetch('/api/play/'+encodeURIComponent(token)).then(function(x){ return x.json(); }).then(function(d){
      if(!d.ok||S.token!==token) return;
      S.playData=d;
      applyLineMemory(d,token);
      updateNavBtns();
    }).catch(function(){});
    req('/skipmarks?token='+encodeURIComponent(token)).then(function(d){ if(S.token===token) S.marks=d.mark; }).catch(function(){});
    return r;
  };
}
function applyLineMemory(d,token){
  var linesEl=$('lines'); if(!linesEl) return;
  var tries=0;
  var iv=setInterval(function(){
    tries++;
    var btns=linesEl.querySelectorAll('.ln');
    if(btns.length||tries>30){ clearInterval(iv); if(!btns.length||S.token!==token) return; pickRemembered(d,btns); }
  },120);
}
function pickRemembered(d,btns){
  if(S.rememberedApplied===S.token) return;
  var p=prefs();
  var playable=(d.lines||[]).map(function(l,i){ return {l:l,i:i}; }).filter(function(x){ return x.l.kind==='hls'||x.l.kind==='mp4'; });
  if(!playable.length) return;
  var hasOfficial=playable.some(function(x){ return lineClass(x.l)==='official'; });
  var cls=hasOfficial?'official':'ordinary';
  var mem=p[cls]; if(!mem) return;
  var hit=playable.find(function(x){ return x.l.provider===mem.providerId||x.l.label===mem.label; });
  if(!hit) return;
  var cur=playable[0];
  if(hit.i!==cur.i&&btns[hit.i]){ S.rememberedApplied=S.token; btns[hit.i].click(); }
}
/* 线路点击 → 记偏好（捕获阶段委托） */
document.addEventListener('click',function(e){
  var ln=e.target&&e.target.closest?e.target.closest('#lines .ln'):null;
  if(!ln||!S.playData) return;
  var btns=[].slice.call(document.querySelectorAll('#lines .ln'));
  var i=btns.indexOf(ln); if(i<0) return;
  var l=(S.playData.lines||[])[i]; if(!l) return;
  var p=prefs(); p[lineClass(l)]={providerId:l.provider||'', playFrom:'', label:l.label||''}; savePrefs(p);
},true);

/* ---------- 工具栏（上下集 / 连播 / PiP / 全屏 / 跳过开关 / 标记） ---------- */
function ensureBar(){
  var v=$('v'); if(!v||$('kj6bar')) return;
  var anchor=$('msg2')||v;
  var bar=E('div'); bar.id='kj6bar';
  bar.style.cssText='display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0';
  function btn(label,fn){ var b=E('button','kj5ab',label); b.onclick=fn; bar.appendChild(b); return b; }
  btn('⏮ 上一集',function(){ goEp('prev'); });
  btn('⏭ 下一集',function(){ goEp('next'); });
  var an=btn('',function(){ S.autoNext=!S.autoNext; try{ localStorage.setItem('kjAutoNext',S.autoNext?'on':'off'); }catch(e){} an.textContent='🔁 自动连播：'+(S.autoNext?'开':'关'); });
  an.id='kj6autonext'; an.textContent='🔁 自动连播：'+(S.autoNext?'开':'关');
  btn('🖼 画中画',function(){ var vv=$('v'); if(vv&&document.pictureInPictureEnabled){ if(document.pictureInPictureElement) document.exitPictureInPicture(); else vv.requestPictureInPicture().catch(function(){}); } });
  btn('⛶ 全屏',function(){ var vv=$('v'); if(vv&&vv.requestFullscreen) vv.requestFullscreen().catch(function(){}); });
  var p=prefs();
  var si=btn('',function(){ var pp=prefs(); pp.skipIntro=!pp.skipIntro; savePrefs(pp); si.textContent='⏩ 跳过片头：'+(pp.skipIntro?'开':'关'); });
  si.textContent='⏩ 跳过片头：'+(p.skipIntro?'开':'关');
  var so=btn('',function(){ var pp=prefs(); pp.skipOutro=!pp.skipOutro; savePrefs(pp); so.textContent='⏩ 跳过片尾：'+(pp.skipOutro?'开':'关'); });
  so.textContent='⏩ 跳过片尾：'+(p.skipOutro?'开':'关');
  btn('🚩 片头结束于此',function(){ setMark('intro'); });
  btn('🚩 片尾开始于此',function(){ setMark('outro'); });
  var info=E('span',null,''); info.id='kj6markinfo'; info.style.cssText='font-size:12px;color:var(--dim)';

  bindVideo(v);
}
function updateNavBtns(){ /* 占位：按钮恒可用，按当前 playData 判断 */ }
function goEp(which){
  var cur=S.playData&&S.playData.current; if(!cur){ toast('暂无'+(which==='next'?'下一集':'上一集')+'信息'); return; }
  var t=which==='next'?cur.next:cur.prev;
  if(!t){ toast(which==='next'?'已经是最后一集':'已经是第一集'); return; }
  window.loadPlay(t, window.curTitle||'');
  var eps=document.querySelectorAll('#detail .eps .ep');
  /* 高亮同步交给原选集逻辑的下一次渲染；此处仅滚动到播放器 */
  var v=$('v'); if(v) v.scrollIntoView({behavior:'smooth',block:'center'});
}
function setMark(kind){
  var v=$('v'); if(!v||!S.token) return;
  var u=(window.KJ4&&KJ4.me)?KJ4.me():null;
  if(!u){ if(window.KJ4&&KJ4.openAuth) KJ4.openAuth('login'); toast('登录后才能提交标记'); return; }
  var body={token:S.token, duration:v.duration||0};
  if(kind==='intro') body.intro_end=Math.round(v.currentTime);
  else body.outro_start=Math.round(v.currentTime);
  var cur=S.marks||{};
  if(kind==='intro'&&cur.outro_start!=null) body.outro_start=cur.outro_start;
  if(kind==='outro'&&cur.intro_end!=null) body.intro_end=cur.intro_end;
  req('/skipmarks',{method:'POST',body:body}).then(function(d){
    if(d.ok){ S.marks=d.mark; showMarkInfo(); toast(kind==='intro'?'已标记片头结束于 '+fmtT(body.intro_end):'已标记片尾开始于 '+fmtT(body.outro_start)); }
    else toast(d.error||'提交失败');
  });
}
function showMarkInfo(){
  var i=$('kj6markinfo'); if(!i) return;
  var m=S.marks;
  i.textContent=m?('本集标记：片头 '+(m.intro_end?fmtT(m.intro_end):'—')+' · 片尾 '+(m.outro_start?fmtT(m.outro_start):'—')+'（'+(m.votes||1)+' 人提交）'):'本集暂无片头/片尾标记';
}

/* ---------- 视频事件：续播 / 音量倍速持久化 / 片尾跳过 / 连播 ---------- */
function resumeStore(){ try{ return JSON.parse(localStorage.getItem('kjResume')||'{}'); }catch(e){ return {}; } }
function bindVideo(v){
  if(v.__kj6bound) return; v.__kj6bound=true;
  /* 音量/静音持久化（原站播放偏好） */
  try{ var vp=JSON.parse(localStorage.getItem('kjVolPrefs')||'null'); if(vp){ if(typeof vp.volume==='number') v.volume=vp.volume; if(typeof vp.muted==='boolean') v.muted=vp.muted; } }catch(e){}
  v.addEventListener('volumechange',function(){ try{ localStorage.setItem('kjVolPrefs', JSON.stringify({volume:v.volume, muted:v.muted})); }catch(e){} });
  v.addEventListener('loadedmetadata',function(){
    showMarkInfo();
    /* 续播 */
    if(S.token&&S.resumeApplied!==S.token){
      var st=resumeStore()[S.token];
      if(st&&st.pos>5&&v.duration&&st.pos<v.duration-15){ S.resumeApplied=S.token; v.currentTime=st.pos; toast('已为你续播到 '+fmtT(st.pos)); }
    }
  });
  var lastSave=0;
  v.addEventListener('timeupdate',function(){
    var now=Date.now();
    if(S.token&&now-lastSave>5000){ lastSave=now; var st=resumeStore(); st[S.token]={pos:v.currentTime, dur:v.duration||0, at:now}; try{ localStorage.setItem('kjResume', JSON.stringify(st)); }catch(e){} }
    /* 跳过片头按钮 */
    var m=S.marks, p=prefs();
    var skipBtn=$('kj6skipintro');
    if(m&&p.skipIntro&&m.intro_end&&v.currentTime>0.3&&v.currentTime<m.intro_end){
      if(!skipBtn){
        skipBtn=E('button',null,'⏩ 跳过片头'); skipBtn.id='kj6skipintro';
        skipBtn.style.cssText='position:absolute;right:18px;bottom:64px;z-index:30;background:rgba(20,18,10,.85);color:#ffd968;border:1px solid #e8b44a;border-radius:8px;padding:9px 18px;font-size:14px;cursor:pointer';
        var wrap=v.parentNode; if(wrap&&getComputedStyle(wrap).position==='static') wrap.style.position='relative';
        skipBtn.onclick=function(){ v.currentTime=m.intro_end+0.1; skipBtn.remove(); };
        if(wrap) wrap.appendChild(skipBtn);
      }
    } else if(skipBtn) skipBtn.remove();
    /* 片尾自动跳过 */
    if(m&&p.skipOutro&&m.outro_start&&!S.outroDone&&v.currentTime>=m.outro_start&&v.currentTime<(v.duration||1e9)-0.5){
      S.outroDone=true;
      var cur=S.playData&&S.playData.current;
      if(S.autoNext&&cur&&cur.next){ toast('片尾跳过，播放下一集'); goEp('next'); }
      else if(v.duration) v.currentTime=v.duration;
    }
  });
  v.addEventListener('ended',function(){
    var cur=S.playData&&S.playData.current;
    if(S.autoNext&&cur&&cur.next){ toast('自动播放下一集'); goEp('next'); }
  });
}

/* ---------- 快捷键（与原站 player-keyboard-shortcut-policy 逐条一致） ---------- */
var INTERACTIVE='input,textarea,select,button,a[href],summary,[contenteditable]:not([contenteditable="false"]),[role="button"],[role="checkbox"],[role="menuitem"],[role="option"],[role="radio"],[role="slider"],[role="switch"],[role="tab"]';
function osd(txt){
  var v=$('v'); if(!v) return;
  var o=$('kj6osd');
  if(!o){ o=E('div'); o.id='kj6osd'; o.style.cssText='position:absolute;left:50%;top:16%;transform:translateX(-50%);z-index:30;background:rgba(0,0,0,.72);color:#fff;border-radius:10px;padding:10px 22px;font-size:19px;font-weight:700;pointer-events:none'; var w=v.parentNode; if(w&&getComputedStyle(w).position==='static') w.style.position='relative'; if(w) w.appendChild(o); }
  o.textContent=txt; o.style.display='block';
  clearTimeout(osd._t); osd._t=setTimeout(function(){ o.style.display='none'; },700);
}
document.addEventListener('keydown',function(e){
  var v=$('v'); if(!v) return;
  var det=$('detail'); if(det&&det.style.display==='none') return;
  if(e.defaultPrevented||e.ctrlKey||e.metaKey||e.altKey) return;
  var t=e.target;
  if(t&&t.closest&&t.closest(INTERACTIVE)) return;
  var isSpace=(e.code==='Space'||e.key===' '||e.key==='Spacebar');
  if(isSpace){
    e.preventDefault();
    if(e.repeat) return;
    if(v.paused) { v.play().catch(function(){}); osd('▶ 播放'); } else { v.pause(); osd('⏸ 暂停'); }
    return;
  }
  if(e.code==='ArrowLeft'||e.key==='ArrowLeft'){ e.preventDefault(); v.currentTime=Math.max(0,v.currentTime-5); osd('⏪ −5s · '+fmtT(v.currentTime)); }
  else if(e.code==='ArrowRight'||e.key==='ArrowRight'){ e.preventDefault(); v.currentTime=Math.min(v.duration||1e9,v.currentTime+5); osd('⏩ +5s · '+fmtT(v.currentTime)); }
  else if(e.code==='ArrowUp'||e.key==='ArrowUp'){ e.preventDefault(); v.muted=false; v.volume=Math.min(1,Math.round((v.volume+0.1)*10)/10); osd('🔊 '+Math.round(v.volume*100)+'%'); }
  else if(e.code==='ArrowDown'||e.key==='ArrowDown'){ e.preventDefault(); v.volume=Math.max(0,Math.round((v.volume-0.1)*10)/10); osd('🔉 '+Math.round(v.volume*100)+'%'); }
});

/* ---------- 工具栏注入轮询 ---------- */
setInterval(function(){
  var det=$('detail');
  if(det&&det.style.display!=='none'&&$('v')&&!$('kj6bar')) ensureBar();
  if($('v')) bindVideo($('v'));
},900);
})();

var css = [
