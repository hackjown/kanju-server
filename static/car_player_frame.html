<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>车载影院播放器 (Tesla-Netflix Bypass)</title>
  <script>
    // ═════════════════════════════════════════════════════════════════
    // 特斯拉行车防护基础环境劫持 (防止行车切档触发 hidden / visibilitychange 暂停)
    // ═════════════════════════════════════════════════════════════════
    (function() {
      try {
        Object.defineProperty(document, 'hidden', { get: () => false, configurable: true });
        Object.defineProperty(document, 'visibilityState', { get: () => 'visible', configurable: true });
        Object.defineProperty(document, 'webkitHidden', { get: () => false, configurable: true });
        Object.defineProperty(document, 'webkitVisibilityState', { get: () => 'visible', configurable: true });
      } catch (e) {}
    })();
  </script>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    .player-page {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #000;
      overflow: hidden;
    }
    .player-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      inset: 0;
      background: #000;
      z-index: 1;
    }

    /* 顶栏 HUD 控制条 (磨砂渐变) */
    .hud-top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 64px;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.45) 60%, rgba(0,0,0,0) 100%);
      z-index: 25;
      pointer-events: none;
      opacity: 1;
      transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .hud-top.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .hud-top > * {
      pointer-events: auto;
    }

    .top-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .top-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .btn-hud {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 8px;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      padding: 7px 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .btn-hud:active {
      transform: scale(0.96);
      background: rgba(0, 229, 255, 0.25);
      border-color: #00e5ff;
    }
    .btn-hud.gold {
      background: rgba(245, 158, 11, 0.2);
      border-color: #f59e0b;
      color: #fbbf24;
    }

    .title-group {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .title-main {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 280px;
    }
    .title-sub {
      font-size: 12px;
      color: #00e5ff;
      white-space: nowrap;
    }

    /* 行车防黑屏技术指示微章 */
    .badge-bypass {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 20px;
      background: rgba(16, 185, 129, 0.18);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34d399;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .badge-bypass-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 6px #10b981;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    /* 缓冲指示遮罩 */
    .spinner-wrap {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 15;
      pointer-events: none;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255, 255, 255, 0.15);
      border-top-color: #00e5ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* 快捷切换集数浮标 (左右侧边缘隐蔽按钮) */
    .btn-side-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 16px 10px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      z-index: 20;
      transition: all 0.2s;
      opacity: 0.7;
    }
    .btn-side-nav:active {
      transform: translateY(-50%) scale(0.95);
      background: rgba(0, 229, 255, 0.3);
      border-color: #00e5ff;
    }
    .btn-side-nav.prev { left: 12px; }
    .btn-side-nav.next { right: 12px; }
    .btn-side-nav.hidden { opacity: 0; pointer-events: none; }

    @media (max-width: 768px) {
      .hud-top { padding: 8px 12px; height: 54px; }
      .title-main { max-width: 160px; font-size: 13px; }
      .badge-bypass { display: none; }
      .btn-hud { padding: 5px 10px; font-size: 12px; }
    }
  </style>
</head>
<body>

  <div class="player-page" id="player-page">
    <!-- Tesla 核心播放引擎专属容器 (挂载 Canvas WebGL + WebCodecs 硬解) -->
    <div class="player-container" id="player-container"></div>

    <!-- 缓冲遮罩 -->
    <div class="spinner-wrap" id="spinner-wrap">
      <div class="spinner"></div>
      <span id="spinner-text" style="font-size: 13px; color: #00e5ff; font-weight: 700;">正在建立极速硬件直解流...</span>
    </div>

    <!-- 自动播放限制遮罩 (针对特斯拉/浏览器首播声音策略) -->
    <div id="autoplay-unlock-overlay" style="display:none; position:absolute; inset:0; z-index:30; background:rgba(0,0,0,0.65); backdrop-filter:blur(4px); flex-direction:column; align-items:center; justify-content:center; cursor:pointer;" onclick="unlockAndResume()">
      <div style="width:72px; height:72px; border-radius:50%; background:rgba(0,229,255,0.25); border:2px solid #00e5ff; display:flex; align-items:center; justify-content:center; box-shadow:0 0 25px rgba(0,229,255,0.4); margin-bottom:16px;">
        <svg viewBox="0 0 24 24" style="width:36px; height:36px; fill:#00e5ff; margin-left:4px;"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
      </div>
      <div style="font-size:18px; font-weight:800; color:#fff; letter-spacing:0.5px;">轻触屏幕开始播放</div>
      <div style="font-size:13px; color:#94a3b8; margin-top:6px;">车机浏览器安全策略需首次触屏激活声音</div>
    </div>

    <!-- 顶栏 HUD (与播放器内置底栏联动呼应) -->
    <div class="hud-top" id="hud-top">
      <div class="top-left">
        <button class="btn-hud" id="btn-back" onclick="handleExit()">
          <span>←</span>
          <span>退出影院</span>
        </button>
        <div class="title-group">
          <div class="title-main" id="disp-title">车载影院</div>
          <div class="title-sub" id="disp-subtitle">正片 · 1080P 极速硬解 (零黑屏)</div>
        </div>
      </div>

      <div class="top-right">
        <button class="btn-hud gold" onclick="openParentDrawer('drawer-lines')" title="切换极速/备用线路">⚡ 换线路</button>
        <button class="btn-hud" onclick="openParentDrawer('drawer-eps')" title="选择剧集">📑 选集</button>

        <div class="badge-bypass" title="Tesla-Netflix 方案就绪 (Canvas WebGL 硬件直解 · 零视频标签 · 行车绝不黑屏)">
          <div class="badge-bypass-dot"></div>
          <span>行车防黑屏就绪</span>
        </div>

        <button class="btn-hud" id="btn-fullscreen-top" onclick="toggleFullscreen()">
          ⛶ 全屏
        </button>
      </div>
    </div>

    <!-- 快捷切集浮标 (选配联动) -->
    <button class="btn-side-nav prev" id="btn-side-prev" onclick="handlePrev()" title="上一集">⏮</button>
    <button class="btn-side-nav next" id="btn-side-next" onclick="handleNext()" title="下一集">⏭</button>
  </div>

  <script type="module">
    import { n as TeslaPlayer } from '/static/tesla_player_engine.js';

    // ─────────────────────────────────────────────────────────────
    // 1. 初始化参数解析与状态管理
    // ─────────────────────────────────────────────────────────────
    const urlParams = new URLSearchParams(window.location.search);
    let rawUrl = urlParams.get('url') || '';
    let streamUrl = rawUrl ? (rawUrl.startsWith('http') ? rawUrl : new URL(rawUrl, window.location.href).href) : '';
    let movieTitle = urlParams.get('title') || '车载影院';
    let epTitle = urlParams.get('ep') || '正片';

    const dispTitle = document.getElementById('disp-title');
    const dispSubtitle = document.getElementById('disp-subtitle');
    const hudTop = document.getElementById('hud-top');
    const btnSidePrev = document.getElementById('btn-side-prev');
    const btnSideNext = document.getElementById('btn-side-next');
    const spinnerWrap = document.getElementById('spinner-wrap');
    const spinnerText = document.getElementById('spinner-text');
    const container = document.getElementById('player-container');

    if (movieTitle) dispTitle.innerText = decodeURIComponent(movieTitle);
    if (epTitle) dispSubtitle.innerText = decodeURIComponent(epTitle) + ' · 1080P 芯片硬解 (Canvas)';

    // ─────────────────────────────────────────────────────────────
    // 2. 解码预设 (Tesla-Netflix Bypass 原装配置)
    // ─────────────────────────────────────────────────────────────
    // 普通模式: WebCodecs 硬解 -> Canvas + AudioWorklet (完全无 video/audio 标签，通常不报“行车仅限音频”)
    // 声音兼容(推荐): WebCodecs 硬解 -> Canvas + MSE Audio (日常首选，行车绝不黑屏)
    const decodePresets = [
      {
        id: 'hardware-mse',
        label: '声音兼容（推荐）',
        description: '日常首选，零黑屏硬解，声音高保真。',
        enableSimd: false,
        enableHardware: true,
        enableWebCodecs: true,
        enableAudioWebcodec: true,
        enableVideoWebcodec: true,
        enableAudioWorklet: true,
        audioMSE: true,
        enableWebGPU: false
      },
      {
        id: 'hardware-worklet',
        label: '普通模式（防提示）',
        description: '通常不显示“行车仅限音频”提示。',
        enableSimd: false,
        enableHardware: true,
        enableWebCodecs: true,
        enableAudioWebcodec: true,
        enableVideoWebcodec: true,
        enableAudioWorklet: true,
        audioMSE: false,
        enableWebGPU: false
      },
      {
        id: 'software-simd-no-mse',
        label: '旧版兼容',
        description: '旧版车机或画面异常时尝试。',
        enableSimd: false,
        enableHardware: false,
        enableWebCodecs: false,
        enableAudioWebcodec: false,
        enableVideoWebcodec: false,
        enableAudioWorklet: true,
        audioMSE: false,
        enableWebGPU: false
      }
    ];

    let player = null;
    let hudTimer = null;
    let watchdogTimer = null;
    let wakeLock = null;
    let hasReceivedFirstTime = false;

    // ─────────────────────────────────────────────────────────────
    // 3. 屏幕常亮 Wake Lock
    // ─────────────────────────────────────────────────────────────
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator && (!wakeLock || wakeLock.released)) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (_) {}
    }
    requestWakeLock();
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') requestWakeLock();
    });

    // ─────────────────────────────────────────────────────────────
    // 4. HUD 自动淡出/呼出联动控制
    // ─────────────────────────────────────────────────────────────
    function showHUD() {
      hudTop.classList.remove('hidden');
      btnSidePrev.classList.remove('hidden');
      btnSideNext.classList.remove('hidden');
      clearTimeout(hudTimer);
      hudTimer = setTimeout(() => {
        if (player && player.isPlaying) {
          hudTop.classList.add('hidden');
          btnSidePrev.classList.add('hidden');
          btnSideNext.classList.add('hidden');
        }
      }, 4500);
    }

    container.addEventListener('pointermove', showHUD);
    container.addEventListener('pointerdown', showHUD);
    container.addEventListener('click', showHUD);

    // ─────────────────────────────────────────────────────────────
    // 5. 看门狗：超时自动换源机制 (10秒无首帧自动向宿主请求下一条线路)
    // ─────────────────────────────────────────────────────────────
    function startWatchdog() {
      clearWatchdog();
      watchdogTimer = setTimeout(() => {
        if (!hasReceivedFirstTime) {
          console.warn('[Watchdog] 首帧加载超时(10s)，触发自动换源...');
          triggerFailover('首帧连接超时');
        }
      }, 10000);
    }

    function clearWatchdog() {
      if (watchdogTimer) {
        clearTimeout(watchdogTimer);
        watchdogTimer = null;
      }
    }

    function triggerFailover(reason) {
      clearWatchdog();
      spinnerWrap.style.display = 'flex';
      spinnerText.innerText = `线路连接超时，正在秒切备用线路...`;
      notifyParent({ type: 'LINE_ERROR', reason: reason });
    }

    // ─────────────────────────────────────────────────────────────
    // 6. 核心播放流加载与事件订阅
    // ─────────────────────────────────────────────────────────────
    async function initPlayer() {
      try {
        spinnerWrap.style.display = 'flex';
        spinnerText.innerText = '正在启动车载芯片硬件解码器...';

        player = new TeslaPlayer({
          container: container,
          loop: false,
          decodePresetOptions: decodePresets,
          decodePresetId: 'hardware-mse',
          showSeekButtons: true,
          showPlaybackRate: true,
          showSettings: true,
          controlsAlwaysVisible: false,
          onToggleFullscreen() {
            window.toggleFullscreen();
          }
        });

        // 订阅播放器底层事件
        player.on('time', (timeMs) => {
          hasReceivedFirstTime = true;
          clearWatchdog();
          spinnerWrap.style.display = 'none';
          notifyParent({
            type: 'TIME_UPDATE',
            currentTime: (Number(timeMs) || 0) / 1000,
            duration: (Number(player.duration) || 0) / 1000
          });
        });

        player.on('ended', () => {
          const cur = Number(player.currentTime) || 0;
          const dur = Number(player.duration) || 0;
          if (hasReceivedFirstTime && cur > 10 && (dur <= 0 || cur >= dur - 5)) {
            console.log('[Player] 本集播放结束，自动下一集, cur:', cur, 'dur:', dur);
            notifyParent({ type: 'REQUEST_NEXT' });
          } else {
            console.warn('[Player] 视频提前中断或解码异常，忽略伪 ended 事件, cur:', cur, 'dur:', dur);
          }
        });

        player.on('error', (err) => {
          console.warn('[Player] 视频流错误:', err);
          triggerFailover('视频流解码异常');
        });

        // 监听底层控制器显示状态，保持顶栏 HUD 步调一致
        if (player.controller) {
          const obs = new MutationObserver(() => {
            if (player.controller.style.visibility === 'visible' || player.controller.style.opacity === '1') {
              showHUD();
            }
          });
          obs.observe(player.controller, { attributes: true, attributeFilter: ['style', 'class'] });
        }

        notifyParent({ type: 'FRAME_READY' });

        if (streamUrl) {
          await loadStream(streamUrl);
        }
      } catch (err) {
        console.error('[Player] 初始化失败:', err);
        triggerFailover('播放器内核启动异常');
      }
    }

    async function loadStream(url) {
      if (!player || !url) return;
      const targetUrl = url.startsWith('http') ? url : new URL(url, window.location.href).href;
      streamUrl = targetUrl;
      hasReceivedFirstTime = false;
      const unlockOverlay = document.getElementById('autoplay-unlock-overlay');
      if (unlockOverlay) unlockOverlay.style.display = 'none';
      spinnerWrap.style.display = 'flex';
      spinnerText.innerText = '正在载入 1080P 硬件直解流...';
      startWatchdog();

      try {
        await player.loadSource(targetUrl, { isLive: false }, true);
      } catch (e) {
        console.warn('[Player] loadSource 失败:', e);
        if (e && (e.name === 'NotAllowedError' || (e.message && (e.message.includes('interact') || e.message.includes('gesture'))))) {
          console.warn('[Player] 浏览器阻止自动播放音频，等待用户触屏激活');
          clearWatchdog();
          spinnerWrap.style.display = 'none';
          showAutoplayUnlockOverlay();
        } else {
          triggerFailover('源地址连接断开');
        }
      }
    }

    function showAutoplayUnlockOverlay() {
      const overlay = document.getElementById('autoplay-unlock-overlay');
      if (overlay) overlay.style.display = 'flex';
    }

    window.unlockAndResume = async function() {
      const overlay = document.getElementById('autoplay-unlock-overlay');
      if (overlay) overlay.style.display = 'none';
      if (player) {
        try {
          if (player.audioContext && player.audioContext.state === 'suspended') {
            await player.audioContext.resume();
          }
          if (player.audio && typeof player.audio.play === 'function') {
            await player.audio.play();
          }
          await player.play();
        } catch (e) {
          console.warn('[Unlock] resume failed:', e);
        }
      }
    };

    function tryGlobalUnlock() {
      const overlay = document.getElementById('autoplay-unlock-overlay');
      if (overlay && overlay.style.display === 'flex') {
        unlockAndResume();
      } else if (player) {
        if (player.audioContext && player.audioContext.state === 'suspended') {
          player.audioContext.resume().catch(() => {});
        }
        if (player.audio && player.audio.paused && player.isPlaying) {
          player.audio.play().catch(() => {});
        }
      }
    }
    document.addEventListener('pointerdown', tryGlobalUnlock);
    document.addEventListener('click', tryGlobalUnlock);
    document.addEventListener('touchstart', tryGlobalUnlock);

    // ─────────────────────────────────────────────────────────────
    // 7. 宿主通信协议 (与外部 car.html 无缝互通)
    // ─────────────────────────────────────────────────────────────
    function notifyParent(msg) {
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(msg, '*');
        }
      } catch (_) {}
    }

    window.addEventListener('message', (ev) => {
      const data = ev.data;
      if (!data || typeof data !== 'object') return;
      if (data.type === 'LOAD_URL') {
        if (data.title) dispTitle.innerText = decodeURIComponent(data.title);
        if (data.epTitle) dispSubtitle.innerText = decodeURIComponent(data.epTitle) + ' · 1080P 芯片硬解 (Canvas)';
        if (data.url) {
          loadStream(data.url);
        }
      }
    });

    // 窗口快捷操作函数
    window.handleExit = () => notifyParent({ type: 'CLOSE' });
    window.handlePrev = () => notifyParent({ type: 'REQUEST_PREV' });
    window.handleNext = () => notifyParent({ type: 'REQUEST_NEXT' });
    window.openParentDrawer = (drawer) => notifyParent({ type: 'OPEN_DRAWER', drawer: drawer });
    window.toggleFullscreen = () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    };

    // 页面加载启动
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initPlayer);
    } else {
      initPlayer();
    }
  </script>
</body>
</html>
