<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>车机极速硬解播放器 (Tesla Bypass)</title>
  <script>
    // ═════════════════════════════════════════════════════════════════
    // 特斯拉 / 新能源车机行车视频防黑屏套件 (Tesla-Netflix Bypass v2.0)
    // ═════════════════════════════════════════════════════════════════
    (function() {
      try {
        // 1. 属性伪装：车载 Chromium 挂 D/R 挡检测 visibilityState 与 hidden
        Object.defineProperty(document, 'hidden', { get: () => false, configurable: true });
        Object.defineProperty(document, 'visibilityState', { get: () => 'visible', configurable: true });
        Object.defineProperty(document, 'webkitHidden', { get: () => false, configurable: true });
        Object.defineProperty(document, 'webkitVisibilityState', { get: () => 'visible', configurable: true });
      } catch (e) {
        console.warn('[Bypass] defineProperty warning:', e);
      }
    })();
  </script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    .player-root {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    /* HUD 交互遮罩层 */
    .hud-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      pointer-events: none;
      opacity: 1;
      transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 10;
      background: linear-gradient(180deg, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0) 25%, rgba(0,0,0,0) 70%, rgba(0,0,0,0.85) 100%);
    }
    .hud-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .hud-overlay > * {
      pointer-events: auto;
    }

    /* 顶栏 */
    .hud-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      gap: 16px;
    }
    .top-left {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }
    .btn-icon {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      padding: 8px 16px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .btn-icon:active {
      transform: scale(0.96);
      background: rgba(0, 229, 255, 0.25);
      border-color: #00e5ff;
    }
    .title-group {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .title-main {
      font-size: 17px;
      font-weight: 700;
      color: #fff;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .title-sub {
      font-size: 12px;
      color: #00e5ff;
      margin-top: 2px;
      font-weight: 500;
    }
    .top-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .bypass-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(74, 222, 128, 0.12);
      border: 1px solid rgba(74, 222, 128, 0.4);
      color: #4ade80;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .bypass-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 8px #4ade80;
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    /* 中央轻触提示 HUD */
    .center-hud {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(0, 229, 255, 0.35);
      backdrop-filter: blur(16px);
      padding: 16px 28px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
      z-index: 20;
    }
    .center-hud.show {
      opacity: 1;
    }
    .center-hud-icon {
      font-size: 24px;
      color: #00e5ff;
    }

    /* 缓冲指示器 */
    .spinner-wrap {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 15;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.15);
      border-top-color: #00e5ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* 底栏 */
    .hud-bottom {
      padding: 16px 24px 24px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* 进度条 */
    .progress-row {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
    }
    .time-text {
      font-size: 13px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: rgba(255, 255, 255, 0.75);
      min-width: 52px;
      text-align: center;
    }
    .progress-track {
      position: relative;
      flex: 1;
      height: 28px;
      display: flex;
      align-items: center;
      cursor: pointer;
      touch-action: none;
    }
    .progress-bg {
      position: relative;
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      overflow: hidden;
      transition: height 0.15s;
    }
    .progress-track:hover .progress-bg,
    .progress-track:active .progress-bg {
      height: 10px;
    }
    .progress-buffered {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      background: rgba(255, 255, 255, 0.35);
      width: 0%;
      border-radius: 4px;
    }
    .progress-played {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      background: linear-gradient(90deg, #00e5ff, #38bdf8);
      width: 0%;
      border-radius: 4px;
    }
    .progress-thumb {
      position: absolute;
      top: 50%;
      left: 0%;
      width: 18px;
      height: 18px;
      margin-left: -9px;
      transform: translateY(-50%);
      background: #fff;
      border: 2px solid #00e5ff;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(0, 229, 255, 0.8);
      transition: transform 0.1s;
      pointer-events: none;
    }
    .progress-track:active .progress-thumb {
      transform: translateY(-50%) scale(1.25);
    }

    /* 控制按钮栏 */
    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      gap: 12px;
    }
    .controls-left, .controls-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn-ctl {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #fff;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      padding: 10px 18px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-ctl:active {
      transform: scale(0.95);
      background: rgba(0, 229, 255, 0.2);
    }
    .btn-ctl.primary {
      background: linear-gradient(135deg, #00e5ff, #0284c7);
      border: none;
      color: #000;
      font-weight: 700;
      padding: 10px 24px;
      box-shadow: 0 4px 16px rgba(0, 229, 255, 0.35);
    }
    .btn-ctl.gold {
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #fbbf24;
    }

    /* 声音解锁大按钮 (自动播放拦截时显示) */
    .btn-unlock-sound {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      border: none;
      color: #000;
      font-weight: 800;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 13px;
      display: none;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      animation: bounce 1.5s infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    /* 响应式调整 */
    @media (max-width: 720px) {
      .hud-top { padding: 10px 14px; }
      .hud-bottom { padding: 10px 14px 16px 14px; }
      .btn-ctl { padding: 8px 12px; font-size: 12px; }
      .btn-ctl.primary { padding: 8px 16px; font-size: 13px; }
      .hide-mobile { display: none !important; }
    }
  </style>
</head>
<body>

  <div class="player-root" id="player-root">
    <!-- 原生硬件解码 Video 标签 (GPU 直解，零 Canvas 性能损耗) -->
    <video
      id="player-video"
      playsinline
      webkit-playsinline
      x5-playsinline
      x5-video-player-type="h5"
      crossorigin="anonymous"
      preload="auto">
    </video>

    <!-- 缓冲动画 -->
    <div class="spinner-wrap" id="spinner-wrap">
      <div class="spinner"></div>
      <span style="font-size: 13px; color: #00e5ff; font-weight: 600;">正在极速加载...</span>
    </div>

    <!-- 中央交互 HUD 弹窗 -->
    <div class="center-hud" id="center-hud">
      <div class="center-hud-icon" id="center-hud-icon">▶</div>
      <div id="center-hud-text">播放</div>
    </div>

    <!-- HUD 交互顶层 -->
    <div class="hud-overlay" id="hud-overlay">
      <!-- 顶栏 -->
      <div class="hud-top">
        <div class="top-left">
          <button class="btn-icon" id="btn-back" onclick="handleExit()">
            <span>←</span>
            <span>退出</span>
          </button>
          <div class="title-group">
            <div class="title-main" id="disp-title">剧场8 车载影院</div>
            <div class="title-sub" id="disp-subtitle">正片 · 1080P 极速直连</div>
          </div>
        </div>

        <div class="top-right">
          <button class="btn-unlock-sound" id="btn-unlock-sound" onclick="unlockAudioManual()">
            🔊 点击开启声音
          </button>
          <div class="bypass-badge" title="行车安全防护套件已就绪 (防黑屏 · WebAudio 声音桥接 · 硬件直解)">
            <div class="bypass-dot"></div>
            <span>行车防黑屏就绪</span>
          </div>
          <button class="btn-icon hide-mobile" id="btn-fullscreen-top" onclick="toggleFullscreen()">
            ⛶ 全屏
          </button>
        </div>
      </div>

      <!-- 底栏 -->
      <div class="hud-bottom">
        <!-- 进度条 -->
        <div class="progress-row">
          <span class="time-text" id="time-cur">00:00</span>
          <div class="progress-track" id="progress-track">
            <div class="progress-bg">
              <div class="progress-buffered" id="progress-buffered"></div>
              <div class="progress-played" id="progress-played"></div>
            </div>
            <div class="progress-thumb" id="progress-thumb"></div>
          </div>
          <span class="time-text" id="time-dur">00:00</span>
        </div>

        <!-- 控制按钮 -->
        <div class="controls-row">
          <div class="controls-left">
            <button class="btn-ctl" id="btn-prev" onclick="handlePrev()">⏮ 上集</button>
            <button class="btn-ctl" onclick="seekRelative(-15)">⏪ 15s</button>
            <button class="btn-ctl primary" id="btn-play" onclick="togglePlayPause()">⏸ 暂停</button>
            <button class="btn-ctl" onclick="seekRelative(15)">⏩ 15s</button>
            <button class="btn-ctl" id="btn-next" onclick="handleNext()">⏭ 下集</button>
          </div>

          <div class="controls-right">
            <button class="btn-ctl gold" id="btn-speed" onclick="cycleSpeed()">1.0x</button>
            <button class="btn-ctl primary" id="btn-fullscreen" onclick="toggleFullscreen()">⛶ 全屏</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 本地优先加载 Hls.js，兼顾离线与高可用 -->
  <script src="/static/hls.min.js"></script>
  <script>
    if (!window.Hls) {
      // 降级 CDN 尝试
      var cdnScript = document.createElement('script');
      cdnScript.src = 'https://cdn.jsdelivr.net/npm/hls.js@latest';
      document.head.appendChild(cdnScript);
    }
  </script>

  <script>
    // ═════════════════════════════════════════════════════════════════
    // 车机播放器核心逻辑与 Drive Bypass 控制
    // ═════════════════════════════════════════════════════════════════
    const video = document.getElementById('player-video');
    const hudOverlay = document.getElementById('hud-overlay');
    const centerHud = document.getElementById('center-hud');
    const centerHudIcon = document.getElementById('center-hud-icon');
    const centerHudText = document.getElementById('center-hud-text');
    const spinnerWrap = document.getElementById('spinner-wrap');
    const btnPlay = document.getElementById('btn-play');
    const btnSpeed = document.getElementById('btn-speed');
    const btnUnlockSound = document.getElementById('btn-unlock-sound');
    const timeCur = document.getElementById('time-cur');
    const timeDur = document.getElementById('time-dur');
    const progressTrack = document.getElementById('progress-track');
    const progressPlayed = document.getElementById('progress-played');
    const progressBuffered = document.getElementById('progress-buffered');
    const progressThumb = document.getElementById('progress-thumb');
    const dispTitle = document.getElementById('disp-title');
    const dispSubtitle = document.getElementById('disp-subtitle');

    let hls = null;
    let audioCtx = null;
    let audioSrc = null;
    let wakeLock = null;
    let userPaused = false;
    let hudTimer = null;
    let centerHudTimer = null;
    let isDragging = false;
    let speedLevels = [1.0, 1.25, 1.5, 2.0, 0.75];
    let currentSpeedIdx = 0;
    let currentPlayUrl = '';

    // ─────────────────────────────────────────────────────────────
    // 1. Web Audio API 声音管线 (绕过车机行车音频静音与视频检测)
    // ─────────────────────────────────────────────────────────────
    function initWebAudio() {
      if (audioCtx) {
        if (audioCtx.state === 'suspended') {
          audioCtx.resume().catch(() => {});
        }
        return;
      }
      try {
        const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
        if (AudioCtxClass) {
          audioCtx = new AudioCtxClass();
          audioSrc = audioCtx.createMediaElementSource(video);
          audioSrc.connect(audioCtx.destination);
          console.log('[TeslaBypass] Web Audio 桥接激活成功');
        }
      } catch (e) {
        console.warn('[TeslaBypass] Web Audio 桥接提示:', e);
      }
    }

    // ─────────────────────────────────────────────────────────────
    // 2. 屏幕常亮 Wake Lock API
    // ─────────────────────────────────────────────────────────────
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator && (!wakeLock || wakeLock.released)) {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLock.addEventListener('release', () => {
            wakeLock = null;
            if (document.visibilityState === 'visible' && !userPaused) {
              requestWakeLock();
            }
          });
        }
      } catch (e) {
        // 部分浏览器不支持或拒绝
      }
    }

    // ─────────────────────────────────────────────────────────────
    // 3. 核心行车防护：visibilitychange 拦截与自动恢复
    // ─────────────────────────────────────────────────────────────
    function handleVisibilityOrDriveShift() {
      // 无论车机系统发送什么状态，立即唤醒音频与视频
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
      if (video && video.paused && !userPaused) {
        video.play().catch(() => {});
      }
      requestWakeLock();
    }

    document.addEventListener('visibilitychange', handleVisibilityOrDriveShift, true);
    window.addEventListener('visibilitychange', handleVisibilityOrDriveShift, true);
    window.addEventListener('focus', handleVisibilityOrDriveShift, true);

    // ─────────────────────────────────────────────────────────────
    // 4. 车载系统非自愿强制暂停拦截 (60ms 快速恢复)
    // ─────────────────────────────────────────────────────────────
    video.addEventListener('pause', () => {
      updatePlayButtonUI();
      if (!userPaused) {
        setTimeout(() => {
          if (!userPaused && video.paused) {
            video.play().catch(() => {});
          }
        }, 60);
      }
    });

    video.addEventListener('play', () => {
      userPaused = false;
      updatePlayButtonUI();
      requestWakeLock();
      btnUnlockSound.style.display = 'none';
    });

    // ─────────────────────────────────────────────────────────────
    // 5. 首次触控全局解锁 (音频 + 常亮)
    // ─────────────────────────────────────────────────────────────
    function unlockOnFirstTouch() {
      initWebAudio();
      requestWakeLock();
      if (video.paused && !userPaused) {
        video.play().catch(() => {});
      }
      document.removeEventListener('click', unlockOnFirstTouch);
      document.removeEventListener('touchstart', unlockOnFirstTouch);
    }
    document.addEventListener('click', unlockOnFirstTouch, { passive: true });
    document.addEventListener('touchstart', unlockOnFirstTouch, { passive: true });

    function unlockAudioManual() {
      initWebAudio();
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
      video.muted = false;
      video.play().then(() => {
        btnUnlockSound.style.display = 'none';
        showCenterHud('🔊', '声音已开启');
      }).catch(() => {});
    }

    // ─────────────────────────────────────────────────────────────
    // 6. 流媒体加载器 (Hls.js / Native MP4，1080P 档位锁定)
    // ─────────────────────────────────────────────────────────────
    function loadStream(url, title, epTitle) {
      if (!url) return;
      currentPlayUrl = url;
      if (title) dispTitle.innerText = title;
      if (epTitle) dispSubtitle.innerText = epTitle + ' · 1080P 极速硬解';

      spinnerWrap.style.display = 'flex';
      btnUnlockSound.style.display = 'none';

      if (hls) {
        try { hls.destroy(); } catch (_) {}
        hls = null;
      }

      let isHls = /\.m3u8(?:$|[?#&])/i.test(url) || /hls/i.test(url);

      if (isHls && window.Hls && Hls.isSupported()) {
        hls = new Hls({
          enableWorker: true,
          lowLatencyMode: false,
          backBufferLength: 60,
          maxBufferLength: 45,
          maxMaxBufferLength: 90,
          fragLoadingTimeOut: 20000,
          manifestLoadingTimeOut: 15000,
        });
        hls.loadSource(url);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, (ev, data) => {
          spinnerWrap.style.display = 'none';
          // 智能锁定 1080P 档位
          if (data && data.levels && data.levels.length > 1) {
            let bestIdx = -1;
            let bestDiff = 999999;
            data.levels.forEach((lvl, idx) => {
              const h = lvl.height || 0;
              const diff = Math.abs(h - 1080);
              if (diff < bestDiff) {
                bestDiff = diff;
                bestIdx = idx;
              }
            });
            if (bestIdx >= 0) {
              hls.currentLevel = bestIdx;
              console.log('[HLS] 优先锁定 1080P 档位:', data.levels[bestIdx].height + 'P');
            }
          }
          attemptPlay();
        });

        hls.on(Hls.Events.ERROR, (ev, data) => {
          if (data.fatal) {
            console.warn('[HLS] Fatal error:', data.type, data.details);
            switch (data.type) {
              case Hls.ErrorTypes.NETWORK_ERROR:
                hls.startLoad();
                break;
              case Hls.ErrorTypes.MEDIA_ERROR:
                hls.recoverMediaError();
                break;
              default:
                notifyParent({ type: 'LINE_ERROR', details: data.details });
                break;
            }
          }
        });
      } else {
        video.src = url;
        video.load();
        attemptPlay();
      }
    }

    function attemptPlay() {
      userPaused = false;
      video.play().then(() => {
        spinnerWrap.style.display = 'none';
        btnUnlockSound.style.display = 'none';
      }).catch(err => {
        spinnerWrap.style.display = 'none';
        console.warn('[Video] 自动播放受浏览器安全策略暂缓:', err);
        btnUnlockSound.style.display = 'inline-flex';
      });
    }

    // ─────────────────────────────────────────────────────────────
    // 7. HUD 显示与自动隐藏
    // ─────────────────────────────────────────────────────────────
    function showHud() {
      hudOverlay.classList.remove('hidden');
      resetHudTimer();
    }

    function hideHud() {
      if (!isDragging && !video.paused) {
        hudOverlay.classList.add('hidden');
      }
    }

    function resetHudTimer() {
      clearTimeout(hudTimer);
      hudTimer = setTimeout(() => {
        hideHud();
      }, 3500);
    }

    function toggleHud() {
      if (hudOverlay.classList.contains('hidden')) {
        showHud();
      } else {
        hideHud();
      }
    }

    // 点击视频区域触发 HUD 切换
    document.getElementById('player-root').addEventListener('click', (e) => {
      // 避免点击控件时误触
      if (e.target.closest('.hud-overlay > *')) return;
      toggleHud();
    });

    function showCenterHud(icon, text) {
      centerHudIcon.innerText = icon;
      centerHudText.innerText = text;
      centerHud.classList.add('show');
      clearTimeout(centerHudTimer);
      centerHudTimer = setTimeout(() => {
        centerHud.classList.remove('show');
      }, 1000);
    }

    // ─────────────────────────────────────────────────────────────
    // 8. 播放与进度条控制
    // ─────────────────────────────────────────────────────────────
    function togglePlayPause() {
      initWebAudio();
      if (video.paused) {
        userPaused = false;
        video.play().catch(() => {});
        showCenterHud('▶', '播放');
      } else {
        userPaused = true;
        video.pause();
        showCenterHud('⏸', '暂停');
        showHud();
      }
      updatePlayButtonUI();
    }

    function updatePlayButtonUI() {
      if (video.paused) {
        btnPlay.innerText = '▶ 播放';
        btnPlay.style.background = 'linear-gradient(135deg, #10b981, #059669)';
      } else {
        btnPlay.innerText = '⏸ 暂停';
        btnPlay.style.background = 'linear-gradient(135deg, #00e5ff, #0284c7)';
      }
    }

    function seekRelative(seconds) {
      showHud();
      const target = Math.max(0, Math.min(video.duration || 0, video.currentTime + seconds));
      video.currentTime = target;
      if (seconds > 0) {
        showCenterHud('⏩', `+${seconds}s`);
      } else {
        showCenterHud('⏪', `${seconds}s`);
      }
    }

    function cycleSpeed() {
      currentSpeedIdx = (currentSpeedIdx + 1) % speedLevels.length;
      const rate = speedLevels[currentSpeedIdx];
      video.playbackRate = rate;
      btnSpeed.innerText = rate + 'x';
      showCenterHud('⚡', `${rate}x 倍速`);
      resetHudTimer();
    }

    function formatTime(sec) {
      if (!sec || isNaN(sec)) return '00:00';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
    }

    video.addEventListener('timeupdate', () => {
      if (!isDragging && video.duration) {
        const pct = (video.currentTime / video.duration) * 100;
        progressPlayed.style.width = pct + '%';
        progressThumb.style.left = pct + '%';
        timeCur.innerText = formatTime(video.currentTime);
        timeDur.innerText = formatTime(video.duration);
      }
      // 缓冲进度
      if (video.buffered && video.buffered.length > 0 && video.duration) {
        const bufferedEnd = video.buffered.end(video.buffered.length - 1);
        const bufPct = (bufferedEnd / video.duration) * 100;
        progressBuffered.style.width = bufPct + '%';
      }
      notifyParent({
        type: 'TIME_UPDATE',
        currentTime: video.currentTime,
        duration: video.duration,
        paused: video.paused
      });
    });

    video.addEventListener('waiting', () => {
      spinnerWrap.style.display = 'flex';
    });
    video.addEventListener('playing', () => {
      spinnerWrap.style.display = 'none';
    });
    video.addEventListener('ended', () => {
      notifyParent({ type: 'ENDED' });
      handleNext();
    });

    // ─────────────────────────────────────────────────────────────
    // 9. 触摸进度条拖动 (针对车机颠簸路况大面积触控优化)
    // ─────────────────────────────────────────────────────────────
    function setSeekFromEvent(e) {
      const rect = progressTrack.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const offsetX = Math.max(0, Math.min(rect.width, clientX - rect.left));
      const pct = offsetX / rect.width;
      if (video.duration) {
        const seekTime = pct * video.duration;
        video.currentTime = seekTime;
        progressPlayed.style.width = (pct * 100) + '%';
        progressThumb.style.left = (pct * 100) + '%';
        timeCur.innerText = formatTime(seekTime);
      }
    }

    progressTrack.addEventListener('mousedown', (e) => {
      isDragging = true;
      setSeekFromEvent(e);
      resetHudTimer();
    });
    window.addEventListener('mousemove', (e) => {
      if (isDragging) {
        setSeekFromEvent(e);
        resetHudTimer();
      }
    });
    window.addEventListener('mouseup', () => {
      if (isDragging) {
        isDragging = false;
        resetHudTimer();
      }
    });

    progressTrack.addEventListener('touchstart', (e) => {
      isDragging = true;
      setSeekFromEvent(e);
      resetHudTimer();
    }, { passive: false });
    window.addEventListener('touchmove', (e) => {
      if (isDragging) {
        setSeekFromEvent(e);
        resetHudTimer();
      }
    }, { passive: false });
    window.addEventListener('touchend', () => {
      if (isDragging) {
        isDragging = false;
        resetHudTimer();
      }
    });

    // ─────────────────────────────────────────────────────────────
    // 10. 全屏、上下集与退出控制
    // ─────────────────────────────────────────────────────────────
    function toggleFullscreen() {
      const el = document.documentElement;
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (el.requestFullscreen) el.requestFullscreen();
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
        showCenterHud('⛶', '全屏模式');
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        showCenterHud('❐', '窗口模式');
      }
    }

    function handlePrev() {
      showCenterHud('⏮', '上一集');
      notifyParent({ type: 'REQUEST_PREV' });
    }

    function handleNext() {
      showCenterHud('⏭', '下一集');
      notifyParent({ type: 'REQUEST_NEXT' });
    }

    function handleExit() {
      notifyParent({ type: 'CLOSE' });
    }

    // ─────────────────────────────────────────────────────────────
    // 11. 与父级 car.html 页面双向通信通信机制 (postMessage)
    // ─────────────────────────────────────────────────────────────
    function notifyParent(data) {
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(data, '*');
        }
      } catch (_) {}
    }

    window.addEventListener('message', (ev) => {
      const data = ev.data;
      if (!data || typeof data !== 'object') return;
      switch (data.type) {
        case 'LOAD_URL':
          if (data.url) {
            loadStream(data.url, data.title, data.epTitle);
            if (typeof data.currentTime === 'number' && data.currentTime > 0) {
              video.currentTime = data.currentTime;
            }
          }
          break;
        case 'PLAY':
          userPaused = false;
          video.play().catch(() => {});
          break;
        case 'PAUSE':
          userPaused = true;
          video.pause();
          break;
        case 'SEEK':
          if (typeof data.time === 'number') {
            video.currentTime = data.time;
          }
          break;
        case 'SET_RATE':
          if (typeof data.rate === 'number') {
            video.playbackRate = data.rate;
          }
          break;
      }
    });

    // ─────────────────────────────────────────────────────────────
    // 12. 初始化：支持直接 URL 传参启动 (独立模式)
    // ─────────────────────────────────────────────────────────────
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const url = params.get('url');
      const title = params.get('title') || '车载影院';
      const ep = params.get('ep') || '正片';
      if (url) {
        loadStream(decodeURIComponent(url), decodeURIComponent(title), decodeURIComponent(ep));
      }
      showHud();
      notifyParent({ type: 'READY' });
    });
  </script>
</body>
</html>
