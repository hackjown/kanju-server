version: '3.8'

services:
  kanju:
    build: .
    container_name: kanju_app
    restart: always
    ports:
      - "8077:8077"
    volumes:
      # 持久化挂载：保护已绑定的 115/夸克 Cookie、点115配置与片单索引
      - ./kanju.db:/app/kanju.db
      - ./kanju_upstream.json:/app/kanju_upstream.json
      - ./cache:/app/cache
    environment:
      - TZ=Asia/Shanghai
    dns:
      - 223.5.5.5
      - 119.29.29.29
      - 8.8.8.8
