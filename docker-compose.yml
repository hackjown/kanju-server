services:
  juchang8:
    build: .
    container_name: juchang8_app
    restart: always
    ports:
      - "8077:8077"
    volumes:
      # 代码与静态资源挂载：git pull 后重启即生效，无需重新 build
      - ./app.py:/app/app.py
      - ./juchang8_plus.py:/app/juchang8_plus.py
      # 持久化挂载：保护已绑定的 115/夸克 Cookie、点115配置与片单索引
      - ./juchang8.db:/app/juchang8.db
      - ./kanju.db:/app/kanju.db
      - ./juchang8_upstream.json:/app/juchang8_upstream.json
      - ./kanju_upstream.json:/app/kanju_upstream.json
      - ./cache:/app/cache
      - ./static:/app/static
      - ./seeds:/app/seeds
    environment:
      - TZ=Asia/Shanghai
    dns:
      - 223.5.5.5
      - 119.29.29.29
      - 8.8.8.8
